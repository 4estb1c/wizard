<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>King — style options</title>
<style>
:root{ --face:#fdfaf0; --navy:#2b3a67; --red:#d6302f; --gold:#b8892b; }
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#2a6350;
  background-image:radial-gradient(ellipse 60% 45% at 25% 15%,#4b8f70 0,transparent 60%),
                   radial-gradient(ellipse 55% 50% at 80% 78%,#3e805f 0,transparent 58%);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-weight:700; color:#fdfbf3; padding:28px 34px 60px; min-height:100vh;
}
h1{font-size:21px; letter-spacing:-.01em; margin-bottom:4px}
.sub{font-size:12.5px; font-weight:600; color:#cfe3d8; margin-bottom:26px; max-width:760px; line-height:1.6}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; max-width:1180px}
.opt{background:rgba(8,18,14,.4); border-radius:14px; padding:16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), 0 4px 20px rgba(0,0,0,.28)}
.opt h2{font-size:14px; margin-bottom:2px}
.opt .n{font-size:9px; text-transform:uppercase; letter-spacing:.16em; color:#8fc3ab; margin-bottom:9px}
.opt p{font-size:11.5px; font-weight:600; line-height:1.6; color:#c8dbd2; margin-top:12px}
.big{display:flex; justify-content:center; margin-bottom:14px}
.strip{display:flex; gap:7px; justify-content:center}

.card{background:var(--face); border-radius:7px; position:relative; overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 0 0 2px #1b1f35, inset 0 0 0 4px var(--face);
  flex:0 0 auto}
.card.lg{width:150px; height:210px}
.card.sm{width:62px; height:87px}
.card svg{position:absolute; inset:0; width:100%; height:100%}
.card .cnr{position:absolute; line-height:.88; text-align:center; font-weight:800;
  font-family:"Inter",system-ui,sans-serif}
.card.lg .cnr{font-size:19px} .card.sm .cnr{font-size:9px}
.cnr.tl{top:6%; left:7%} .cnr.br{bottom:6%; right:7%; transform:rotate(180deg)}
.cnr i{display:block; font-style:normal; font-size:.92em; margin-top:.08em}
</style>
</head>
<body>
<h1>King — four style options</h1>
<div class="sub">Same card, four directions. Each shown large in spades, then small in all four
suits at the size it actually renders in a seven-card hand — a face card has to survive being
70px wide, which is where the pixel figures were falling apart.</div>
<div class="grid" id="grid"></div>

<script>
const NAVY="#2b3a67", RED="#d6302f", GOLD="#b8892b";
const SUITS=["♠","♥","♦","♣"];
const colorOf = s => (s===1||s===2) ? RED : NAVY;

/* ---------------------------------------------------------------- 1. MONOGRAM
   No figure at all. A single high-contrast serif letterform, a hairline frame and the
   suit. The most modern of the four and the only one that stays perfectly legible at
   any size, because it is type rather than drawing. */
const monogram = c => `
<svg viewBox="0 0 100 140">
  <rect x="9" y="9" width="82" height="122" rx="4" fill="none" stroke="${c}"
        stroke-width="1" opacity=".28"/>
  <rect x="13" y="13" width="74" height="114" rx="2" fill="none" stroke="${c}"
        stroke-width=".6" opacity=".2"/>
  <text x="50" y="83" text-anchor="middle" fill="${c}"
        font-family="Georgia,'Times New Roman',serif" font-size="66">K</text>
  <line x1="30" y1="95" x2="70" y2="95" stroke="${c}" stroke-width=".8" opacity=".35"/>
  <text x="50" y="115" text-anchor="middle" fill="${c}"
        font-family="Georgia,serif" font-size="20">SUIT</text>
</svg>`;

/* ---------------------------------------------------------------- 2. LINE CROWN
   A single-weight stroked crown. Restrained and a little jewellery-like; reads as a
   drawing without any solid mass, so it never muddies at small sizes. */
const lineCrown = c => `
<svg viewBox="0 0 100 140" fill="none" stroke="${c}" stroke-width="2.4"
     stroke-linejoin="round" stroke-linecap="round">
  <path d="M26 84 L26 54 L38 70 L50 44 L62 70 L74 54 L74 84 Z"/>
  <rect x="24" y="86" width="52" height="14" rx="3"/>
  <circle cx="26" cy="52" r="3.4" fill="${c}"/>
  <circle cx="50" cy="41" r="4"  fill="${c}"/>
  <circle cx="74" cy="52" r="3.4" fill="${c}"/>
  <circle cx="38" cy="93" r="2.6" fill="${c}" stroke="none"/>
  <circle cx="50" cy="93" r="2.6" fill="${c}" stroke="none"/>
  <circle cx="62" cy="93" r="2.6" fill="${c}" stroke="none"/>
  <line x1="34" y1="108" x2="66" y2="108" stroke-width="1.4" opacity=".45"/>
</svg>`;

/* ---------------------------------------------------------------- 3. DECO
   Flat geometry, hard symmetry, two tones. Bold enough to hold its own next to the
   Balatro chrome and the most graphic of the four at a glance. */
const deco = c => `
<svg viewBox="0 0 100 140">
  <g fill="${c}">
    <path d="M50 30 L58 62 L42 62 Z"/>
    <path d="M28 42 L40 66 L26 66 Z" opacity=".82"/>
    <path d="M72 42 L74 66 L60 66 Z" opacity=".82"/>
  </g>
  <g fill="${GOLD}">
    <path d="M38 38 L46 64 L34 64 Z" opacity=".9"/>
    <path d="M62 38 L66 64 L54 64 Z" opacity=".9"/>
  </g>
  <rect x="24" y="68" width="52" height="9" fill="${c}"/>
  <rect x="24" y="80" width="52" height="4" fill="${GOLD}"/>
  <path d="M30 88 L70 88 L62 104 L38 104 Z" fill="${c}" opacity=".9"/>
  <circle cx="50" cy="24" r="5" fill="${GOLD}"/>
  <circle cx="50" cy="96" r="4" fill="${GOLD}"/>
</svg>`;

/* ---------------------------------------------------------------- 4. SILHOUETTE
   A crowned bust in solid fill, mirrored top to bottom the way a real court card is,
   so it reads correctly whichever way the card is held. The most traditional. */
const bustPath = `
  M30 30 L30 15 L38 23 L44 9 L50 18 L56 9 L62 23 L70 15 L70 30
  C70 47 62 55 50 55 C38 55 30 47 30 30 Z`;
const silhouette = c => `
<svg viewBox="0 0 100 140">
  <g fill="${c}">
    <path d="${bustPath}"/>
    <path d="M22 70 C22 59 34 55 50 55 C66 55 78 59 78 70 Z"/>
  </g>
  <g fill="${c}" transform="rotate(180 50 70)">
    <path d="${bustPath}"/>
    <path d="M22 70 C22 59 34 55 50 55 C66 55 78 59 78 70 Z"/>
  </g>
  <circle cx="50" cy="21" r="3" fill="var(--face)"/>
  <circle cx="50" cy="119" r="3" fill="var(--face)"/>
  <line x1="16" y1="70" x2="84" y2="70" stroke="var(--face)" stroke-width="2.4"/>
  <line x1="16" y1="70" x2="84" y2="70" stroke="${c}" stroke-width=".8" opacity=".5"/>
</svg>`;

const STYLES=[
  {key:"monogram",   name:"Monogram", tag:"Typographic",
   art:monogram, blurb:"No figure — one serif letterform, a hairline double frame and the suit. Cleanest of the four and the only one that cannot degrade at small sizes, because it is type."},
  {key:"linecrown",  name:"Line Crown", tag:"Drawn, single weight",
   art:lineCrown, blurb:"An outlined crown with solid jewels. Light on the card, jewellery-like, and it holds together small because there is no solid mass to muddy."},
  {key:"deco",       name:"Deco", tag:"Flat geometry",
   art:deco, blurb:"Hard symmetry, two tones, no outlines. The most graphic option and the closest in spirit to the chunky Balatro chrome without being cartoonish."},
  {key:"silhouette", name:"Silhouette", tag:"Classic, mirrored",
   art:silhouette, blurb:"A crowned bust in solid fill, mirrored top to bottom the way a real court card is. The most traditional, and the most detail to lose when shrunk."},
];

function card(style, suit, size){
  const col=colorOf(suit), s=SUITS[suit];
  const svg=style.art(col).replace(">SUIT<", ">"+s+"<");
  return `<div class="card ${size}" style="color:${col}">
    ${svg}
    <div class="cnr tl">K<i>${s}</i></div><div class="cnr br">K<i>${s}</i></div>
  </div>`;
}
document.getElementById("grid").innerHTML = STYLES.map((st,i)=>`
  <div class="opt">
    <h2>${i+1}. ${st.name}</h2>
    <div class="n">${st.tag}</div>
    <div class="big">${card(st,0,"lg")}</div>
    <div class="strip">${[0,1,2,3].map(su=>card(st,su,"sm")).join("")}</div>
    <p>${st.blurb}</p>
  </div>`).join("");
</script>
</body>
</html>
