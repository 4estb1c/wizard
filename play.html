<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard</title>
<style>
/* ============================================================ palette */
:root{
  --felt-1:#4b8f70; --felt-2:#357a5c; --felt-3:#2a6350;
  --panel:#39404b; --panel-2:#454d5a; --panel-dark:#22262e; --edge:#12151b;
  --gold:#e5a23c; --gold-hi:#f6c860; --gold-lo:#9d6516;
  --blue:#2b9bf0; --blue-lo:#12507f;
  --red:#ef5a4c; --red-lo:#8d2820;
  --ink:#fdfbf3; --dim:#9aa4b2;
  --face:#fdfaf0; --navy:#2b3a67; --pipred:#d6302f;
  --cw:86px; --ch:122px;
  /* Jester face: a true tessellation, red and black diamonds of equal size with no gaps.
     The tile carries four quarter-diamonds at its corners, which leaves the complementary
     black diamond in the middle, so the two colours cover the card exactly. Held here as a
     variable because the flip animation needs the same fill on a second element. */
  /* Wizard face: a night sky rather than a flat navy. Two nebula washes over the gradient,
     then a scatter of stars as one repeating tile — the tile is deliberately not square and
     its stars are at irregular offsets, so at 86px the repeat never lines up into a grid.
     Three sizes of star, the small ones dimmest, which is what stops it reading as dots. */
  --wizface:
    radial-gradient(circle at 22% 18%, rgba(120,150,255,.16) 0%, transparent 42%),
    radial-gradient(circle at 78% 76%, rgba(190,120,255,.14) 0%, transparent 46%),
    url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='64' height='86' viewBox='0 0 64 86'>\
<g fill='%23ffffff'>\
<circle cx='7' cy='11' r='1.15' opacity='.85'/><circle cx='39' cy='5' r='.62' opacity='.4'/>\
<circle cx='55' cy='19' r='.85' opacity='.6'/><circle cx='21' cy='27' r='.55' opacity='.35'/>\
<circle cx='47' cy='36' r='1.3' opacity='.9'/><circle cx='12' cy='44' r='.7' opacity='.45'/>\
<circle cx='31' cy='52' r='.5' opacity='.3'/><circle cx='60' cy='58' r='.95' opacity='.62'/>\
<circle cx='5' cy='66' r='.6' opacity='.38'/><circle cx='42' cy='71' r='1.05' opacity='.75'/>\
<circle cx='25' cy='80' r='.52' opacity='.32'/><circle cx='52' cy='84' r='.72' opacity='.48'/>\
</g><g fill='%23f6d98a'>\
<circle cx='16' cy='33' r='.8' opacity='.55'/><circle cx='58' cy='45' r='.6' opacity='.4'/>\
<circle cx='34' cy='63' r='.7' opacity='.45'/></g></svg>"),
    linear-gradient(168deg,#2a3160,#0e1128);
  /* Jester face: aged paper, warm in the middle and dirtier at the edges, with the diamond
     lattice over it at a tenth strength. The lattice paints only its own diamonds rather
     than a solid complementary colour — as a full-strength two-tone check it shouted over
     the drawing no matter how close the two colours were. */
  --parchment:radial-gradient(ellipse 82% 74% at 48% 42%,
    #e7d7b3 0%, #ddc99e 40%, #c9b184 78%, #b39a70 100%);
  --harlequin:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='20' height='24' viewBox='0 0 20 24'>\
<g fill='%235b3b8f' opacity='0.1'>\
<path d='M0 -12 L10 0 L0 12 L-10 0 Z'/><path d='M20 -12 L30 0 L20 12 L10 0 Z'/>\
<path d='M0 12 L10 24 L0 36 L-10 24 Z'/><path d='M20 12 L30 24 L20 36 L10 24 Z'/>\
</g></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,
    "Helvetica Neue",Arial,sans-serif;
  font-weight:700; letter-spacing:.005em;
  background:#0e1a16; color:var(--ink); overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
}
/* Balatro outlines every glyph; that reads as a cartoon on flat chrome, so the heavy
   outline is kept only for text sitting directly on the felt (.on) and everything on a
   panel gets a soft modern shadow instead. */
.o{ text-shadow:0 1px 2px rgba(0,0,0,.45) }
.o1{ text-shadow:0 1px 1px rgba(0,0,0,.35) }
.on{ text-shadow:
   1px 0 0 rgba(0,0,0,.75),-1px 0 0 rgba(0,0,0,.75),0 1px 0 rgba(0,0,0,.75),
   0 -1px 0 rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5); }
.up{text-transform:uppercase; letter-spacing:.11em}

/* ============================================================ layout */
#app{display:flex; height:100vh; gap:12px; padding:12px; background:#0e1a16}
.side{width:308px; flex:0 0 308px; display:flex; flex-direction:column; gap:10px;
  overflow-y:auto; scrollbar-width:thin}
/* Flex items default to shrinking, which squashed the panels and clipped the contract
   number on short windows. Let them keep their height and scroll the column instead. */
.side > *{flex-shrink:0}
.felt{
  flex:1; position:relative; border-radius:10px; overflow:hidden;
  background:
    radial-gradient(ellipse 62% 46% at 24% 16%, var(--felt-1) 0%, transparent 62%),
    radial-gradient(ellipse 54% 52% at 82% 74%, #3e805f 0%, transparent 58%),
    radial-gradient(ellipse 46% 40% at 60% 42%, #3a7a60 0%, transparent 60%),
    var(--felt-3);
  box-shadow:inset 0 0 0 5px #0b100e, inset 0 0 120px rgba(0,0,0,.4);
  display:flex; flex-direction:column;
}
/* A conic gradient nearly twice the size of the table, turning forever. will-change makes the
   browser rasterise it once and then only rotate that texture on the GPU, instead of
   re-rendering a very large translucent gradient on every frame. */
.felt::before{
  content:""; position:absolute; inset:-40%; will-change:transform;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.055),transparent 38%,
    rgba(0,0,0,.07) 62%,transparent);
  animation:swirl 60s linear infinite; pointer-events:none;
}
@keyframes swirl{to{transform:rotate(360deg)}}

/* ============================================================ panels */
.panel{background:var(--panel); border-radius:12px; padding:11px;
  box-shadow:0 2px 10px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.06)}
.inset{background:rgba(0,0,0,.26); border-radius:8px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}

.blind{padding:0; overflow:hidden; background:#8c5c14;
  box-shadow:0 2px 12px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14)}
.blind h1{font-size:24px; font-weight:800; text-align:center; padding:11px 0 10px;
  letter-spacing:.05em; background:linear-gradient(180deg,#eaa93f,#c8871f)}
.blind-body{display:flex; align-items:center; gap:11px; padding:11px}
.chip{width:64px; height:64px; flex:0 0 64px; border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#f7cd77,#d99a26 62%,#a8721c);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.22), 0 2px 8px rgba(0,0,0,.3);
  display:grid; place-items:center; font-size:12px; line-height:1.1; text-align:center}
.blind-info{flex:1; border-radius:8px; padding:8px; text-align:center;
  background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cap{font-size:10px; color:#e6c894; text-transform:uppercase; letter-spacing:.12em}
.big{font-size:32px; font-weight:800; color:var(--red); line-height:1.06; margin:1px 0 2px}
.big.ok{color:#7ee79a}

.row{display:flex; align-items:center; gap:9px}
.row .lbl{font-size:11px; line-height:1.25; flex:0 0 74px; color:var(--dim);
  text-transform:uppercase; letter-spacing:.11em}
.row .val{flex:1; text-align:center; font-size:28px; font-weight:800; padding:7px 0}

.title{font-size:11px; text-align:center; padding-bottom:9px; color:var(--dim);
  text-transform:uppercase; letter-spacing:.11em}
.title small{font-size:11px; color:#6f7a89}
.cm{display:flex; align-items:stretch; gap:8px}
.cm .box{flex:1; border-radius:9px; text-align:center; padding:7px 0 6px; font-size:38px;
  font-weight:800; line-height:1; box-shadow:inset 0 1px 0 rgba(255,255,255,.16),
  0 2px 8px rgba(0,0,0,.28)}
.cm .box .t{display:block; font-size:9px; letter-spacing:.16em; opacity:.82;
  text-transform:uppercase; font-weight:700}
.cm .blue{background:var(--blue)}
.cm .red{background:var(--red)}
.cm .x{align-self:center; font-size:18px; color:#6f7a89}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.stat{border-radius:8px; text-align:center; padding:7px 2px 6px}
.stat .k{font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.12em}
.stat .v{font-size:23px; font-weight:800; line-height:1.15}
.v.blue{color:#63c0ff} .v.red{color:#ff9186} .v.gold{color:#f6c860}

button{
  font:inherit; font-size:13px; font-weight:700; color:var(--ink); border:0;
  cursor:pointer; border-radius:9px; padding:11px 10px; letter-spacing:.02em;
  transition:filter .14s ease, transform .08s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.3);
}
button:hover{filter:brightness(1.13)}
button:active{transform:translateY(1px); filter:brightness(.95)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold); color:#2b1d05}
.btn-blue{background:var(--blue)}
.btn-grey{background:#4a525f}
.spacer{flex:1}

/* ============================================================ felt content */
.zone{position:relative; z-index:2; display:flex; align-items:center; justify-content:center}
.zone.opp{height:158px; gap:9px; flex-direction:column; padding-top:12px}
.zone.mid{flex:1; gap:34px}
.zone.mine{height:200px; flex-direction:column; gap:8px; padding-bottom:12px}

.tag{background:rgba(9,19,15,.82); border-radius:999px; padding:6px 16px; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.11em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 10px rgba(0,0,0,.28)}
.tag b{color:#f6c860; letter-spacing:.02em}

.slot{width:var(--cw); height:var(--ch); border-radius:9px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.1); display:grid; place-items:center;
  font-size:22px; color:rgba(255,255,255,.14)}
/* Holding a card in flight: the frame is still drawn, but the diamond that marks an empty
   slot is not — the card is on its way, so the slot is no longer offering itself. */
.slot.empty{color:transparent}
.slot-wrap{display:flex; flex-direction:column; align-items:center; gap:8px}
.slot-wrap .cap{font-size:9px; color:rgba(255,255,255,.5); text-transform:uppercase;
  letter-spacing:.16em}

.hand{display:flex; justify-content:center; align-items:flex-end; min-height:calc(var(--ch) + 26px)}
/* Each card sits in a wrapper, and the two split the work on transform: the wrapper breathes,
   the card lifts. They cannot share one element — a running animation on a property suppresses
   transitions on that same property, so while the idle bob animated the card's own transform
   the hover lift had no way to interpolate and simply snapped into place. */
.cardwrap{position:relative; flex:0 0 auto; will-change:transform}
.hand .cardwrap{margin-left:calc(-1 * var(--ovl,13px))}
.hand .cardwrap:first-child{margin-left:0}
.hand .cardwrap:hover{z-index:9}

/* ============================================================ cards */
.card{
  width:var(--cw); height:var(--ch); border-radius:7px; position:relative; overflow:hidden;
  background:var(--face); color:var(--navy); flex:0 0 auto;
  font-size:calc(var(--cw) * .22);
  box-shadow:0 6px 16px rgba(0,0,0,.4), 0 1px 0 rgba(0,0,0,.45),
    inset 0 0 0 2px #1b1f35, inset 0 0 0 4px var(--face);
  /* Transform only. Transitioning box-shadow and filter as well meant every hover repainted
     the whole card — and each card is a full inline SVG — so running the mouse along the fan
     re-rasterised eight of them per frame. Transform alone is handled by the compositor. */
  transition:transform .13s cubic-bezier(.22,.72,.3,1);
}
/* The face is one SVG on a fixed viewBox, so it scales exactly with the card. Corner
   indices stay HTML and are sized in em off the card's own width. */
.card svg{position:absolute; inset:0; width:100%; height:100%}
.card .cnr{position:absolute; line-height:.88; text-align:center; font-size:.72em;
  font-weight:800; letter-spacing:0}
.card .cnr.tl{top:6%; left:7.5%}
.card .cnr.br{bottom:6%; right:7.5%; transform:rotate(180deg)}
.card .cnr i{display:block; font-style:normal; font-size:.9em; margin-top:.08em}
/* will-change promotes each playable card to its own layer up front, so the lift is a GPU
   transform of an already-rasterised texture rather than a fresh paint of the SVG.
   No !important here: nothing competes for transform any more, so the transition governs the
   whole move in and out of the raised state. */
.card.playable{cursor:pointer; will-change:transform}
.card.playable:hover{transform:translate3d(0,-20px,0) scale(1.06) rotate(0deg)}
.card.dim{filter:brightness(.46) saturate(.35) contrast(.9)}

/* ---- hotkey indicators ----
   Keys run left to right across the fan, so the digit is a position and not a property of
   the card. Drawn only while a card is actually being asked for; during bidding the same
   digits mean bids. */
.hotkey{position:absolute; z-index:6; font-weight:800; pointer-events:none;
  top:5px; right:5px; width:17px; height:17px; border-radius:50%;
  background:rgba(10,16,13,.82); color:#f6c860; font-size:10.5px;
  display:grid; place-items:center; box-shadow:inset 0 0 0 1px rgba(246,200,96,.45)}
.card.dim .hotkey{display:none}
.card.sp{background:var(--wizface);
  box-shadow:0 6px 16px rgba(0,0,0,.5), 0 1px 0 rgba(0,0,0,.45),
    inset 0 0 0 2px #d4a53a, inset 0 0 0 4px #171c38}
.card.je{
  background-image:var(--harlequin), var(--parchment);
  background-size:16px 20px, auto;
  box-shadow:0 6px 16px rgba(0,0,0,.45), 0 1px 0 rgba(0,0,0,.4),
    inset 0 0 0 2px #4a2f73, inset 0 0 0 4px #e3d1a9}
/* The fan tilt lives in a custom property, not an inline transform, so the keyframe can
   carry it through — otherwise the card animates flat and then snaps into its rotation.
   --dx/--dy are measured at deal time so each card flies in from the actual deck pile. */
.card, .backs .b{transform:rotate(var(--tilt,0deg))}
/* The idle bob is not a CSS animation — see startIdle(). A keyframe animation replaces the
   transform outright and outranks a transition, so hovering had nothing to interpolate from
   and the card snapped to the raised position. The bob is an additive Web Animation instead,
   which composes with whatever transform the element already has, so the hover transition
   runs underneath it and lifts the card from wherever the bob has it at that instant. */
.hand .card{will-change:transform}

.card.predeal, .backs .b.predeal{opacity:0}
.card.deal, .backs .b.deal{animation:deal .29s cubic-bezier(.18,.85,.3,1) backwards;
  will-change:transform, opacity}
@keyframes deal{
  from{transform:translate(var(--dx,0px),var(--dy,-56px)) rotate(var(--spin,0deg)) scale(.74);
       opacity:0}
}

/* A played card turns over in the air, which needs two faces on one element. Only the
   Jester uses it, but the wrapper is generic so any card could. */
.card.flipping{background:none!important; box-shadow:none!important; overflow:visible;
  perspective:760px}
/* .fs, not .side: the sidebar already owns .side and its width:308px was landing on these
   faces, which is what blew the flipping card up to three times its size. */
.card.flipping > .fl{position:absolute; inset:0; transform-style:preserve-3d}
.card.flipping .fs{position:absolute; inset:0; border-radius:7px; overflow:hidden;
  backface-visibility:hidden; background:var(--face);
  box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 0 0 2px #1b1f35, inset 0 0 0 4px var(--face)}
.card.flipping .fs.je{background-image:var(--harlequin), var(--parchment);
  background-size:16px 20px, auto;
  box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 0 0 2px #4a2f73, inset 0 0 0 4px #e3d1a9}
.card.flipping .fs.sp{background:var(--wizface);
  box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 0 0 2px #d4a53a, inset 0 0 0 4px #171c38}
.card.flipping .fs.b{transform:rotateY(180deg); background:#a4271f;
  box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 0 0 2px #1b1f35,
             inset 0 0 0 5px #f0e4cf, inset 0 0 0 8px #a4271f}
.card.flipping .fs.b::after{content:""; position:absolute; inset:9px;
  background-image:repeating-linear-gradient(45deg,#d8483c 0 4px,transparent 4px 8px),
                   repeating-linear-gradient(-45deg,#d8483c 0 4px,transparent 4px 8px)}
/* ---- the bid prompt ----
   Anchored near the top of the felt rather than centred, and with a much lighter scrim, so
   the hand underneath stays readable while you choose. */
.ov.bid{background:rgba(6,14,11,.34); align-items:flex-start; padding:0 12px}
.ov.bid .box{margin-top:clamp(40px,9vh,104px); min-width:0; text-align:left;
  width:min(460px, calc(100vw - 24px)); padding:16px 18px 15px}
.bidhead{display:flex; align-items:center; gap:16px; margin-bottom:12px}
.bidnum{flex:0 0 auto; text-align:center; background:rgba(0,0,0,.28); border-radius:10px;
  padding:5px 16px 7px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.bignum{font-size:46px; font-weight:800; line-height:1.02; color:#ff9186}
.bignum.dim{color:#5d6673}
.bidsay{flex:1; min-width:0}
.bidmain{font-size:14.5px; font-weight:700; line-height:1.45; color:#e7ecf3}
.bidmain b{color:#f6c860}
.bidhook{font-size:11.5px; font-weight:700; color:#9aa4b2; margin-top:4px;
  text-transform:uppercase; letter-spacing:.09em}
.bidhook b{color:#ff9186}
.ov.bid .bidrow{margin:0 0 11px; justify-content:flex-start}
.bidfoot{font-size:11.5px; font-weight:600; color:#98a2af; line-height:1.5}
.bidfoot b{color:#c9d2dd}

/* ---- title screen ----
   One card, face down, centred on the felt. The setup is present from the start but folded
   away to zero height so revealing it is a transition rather than a second dialog. */
.ov.start{background:rgba(6,14,11,.62)}
/* Opening screen: one card on an empty felt. The sidebar is a sibling of the felt rather
   than a child, so the overlay alone never hid it and the trump badge, deck pile and both
   hand tags all showed through behind the title card. */
body.preboot .side, body.preboot .trumpbadge, body.preboot .trumplabel,
body.preboot .trumpcard, body.preboot .deckpile, body.preboot .log,
body.preboot .zone, body.preboot .solver, body.preboot .sv-open{display:none}
body.preboot #app{grid-template-columns:1fr}
body.preboot .ov.start{background:transparent}
.startwrap{display:flex; flex-direction:column; align-items:center; gap:16px}

/* ==========================================================================
   TITLE CARD — invite, idle and power

   Three layers, because one element cannot hold two independent transforms and the card
   itself already owns the flip and the click bounce:

       .startaura   the emanation, behind, never transformed by anything else
         .startfloat  the idle, and nothing else
           .startcard the flip and the hover, untouched

   Sheen is the exception that is safe on the card itself: it animates a pseudo-element of
   its own overlay rather than the card, so the hover transition still has something to
   interpolate.
   ========================================================================== */
.startaura{position:relative; display:grid; place-items:center}
.startfloat{position:relative; will-change:transform}

/* Face down: a light sweeps the back on a long cycle. Nothing moves, so it reads as a
   highlight catching the card rather than as the card asking to be pressed. */
.startcard .gloss{position:absolute; inset:0; border-radius:10px; overflow:hidden;
  pointer-events:none; z-index:2}
.startcard.iv-sheen .gloss::before{
  content:""; position:absolute; top:-60%; left:0; width:80%; height:220%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  will-change:transform; animation:ivSheen 4.6s ease-in-out infinite;
}
@keyframes ivSheen{
  0%,62%{transform:translateX(-180%) rotate(18deg)}
  100%{transform:translateX(320%) rotate(18deg)}
}

/* The label opens and closes its tracking. letter-spacing is a layout property, which would
   normally be the wrong thing to animate — but it is one short line of text and the spacing
   IS the effect, so there is nothing cheaper that does the same job. */
@keyframes hnTrack{0%,100%{letter-spacing:.08em; opacity:.6} 50%{letter-spacing:.2em; opacity:.95}}
.starthint.hn-track{animation:hnTrack 3.4s ease-in-out infinite}

/* Face up: bob with a rock either side of vertical. */
@keyframes idPend{
  0%,100%{transform:translateY(0) rotate(-1.8deg)}
  50%{transform:translateY(-9px) rotate(1.8deg)}
}
.id-pendulum{animation:idPend 4.6s ease-in-out infinite}

/* ---------------------------------------------------------------- embers

   Sparks lift from behind the card and drift as they rise.

   Tuned to stay on the compositor. Each spark animates transform and opacity only, and is
   promoted up front with will-change so the browser rasterises it once and then only moves
   the texture. Two things the first version got wrong and this one does not:

     - the glow was a box-shadow, which is a paint operation on a blurred rectangle. It is a
       radial-gradient background now, rasterised once into the layer.
     - the end position was calc(var(--x) + var(--dx)) inside the keyframe, so the custom
       properties had to be resolved on every frame. Both endpoints are plain values written
       by the builder instead, and the keyframe touches no variables at all.
*/
.pw-embers .ember{
  position:absolute; left:50%; bottom:14%; width:9px; height:9px; margin:-3px;
  border-radius:50%; pointer-events:none; will-change:transform, opacity;
  background:radial-gradient(circle, #fff6d8 0 18%, #f6d98a 34%, rgba(246,200,96,.42) 58%,
                             transparent 72%);
  animation:pwRise var(--dur) linear infinite;
}
@keyframes pwRise{
  0%{opacity:0; transform:translate3d(var(--x0),0,0) scale(.5)}
  14%{opacity:1}
  70%{opacity:.9}
  100%{opacity:0; transform:translate3d(var(--x1),-230px,0) scale(.25)}
}

.starthint{contain:layout}      /* tracking is a layout property; keep the reflow local */
@media (prefers-reduced-motion:reduce){
  .startcard.iv-sheen .gloss::before, .starthint.hn-track, .id-pendulum,
  .pw-embers .ember{animation:none}
}

.startcard{position:relative; width:176px; height:250px; cursor:pointer; perspective:1000px;
  filter:drop-shadow(0 16px 34px rgba(0,0,0,.55));
  transition:transform .16s ease, filter .16s ease}
.startcard:hover{transform:translateY(-6px); filter:drop-shadow(0 22px 40px rgba(0,0,0,.6))}
.startcard.turned{cursor:default}
/* The back is the untransformed face here and the Wizard is the one turned away, so the
   card is unambiguously face down before any script runs. */
.startcard .fl{position:absolute; inset:0; transform-style:preserve-3d}
.startcard .fs{position:absolute; inset:0; border-radius:10px; overflow:hidden;
  backface-visibility:hidden}

  box-shadow:inset 0 0 0 3px #1b1f35, inset 0 0 0 7px #f0e4cf, inset 0 0 0 11px #a4271f}

  background:var(--panel); border-radius:14px; padding:0 26px; width:min(430px,88vw);

/* Impact ring thrown off a slammed Wizard. */
.ring{position:absolute; z-index:8; border-radius:9px; pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.7)}

.back{border-radius:7px; box-shadow:0 5px 14px rgba(0,0,0,.4), inset 0 0 0 2px #1b1f35,

  background:#a4271f; position:relative; overflow:hidden}
.back::after{content:""; position:absolute; inset:9px;
  background-image:
    repeating-linear-gradient(45deg, #d8483c 0 4px, transparent 4px 8px),
    repeating-linear-gradient(-45deg, #d8483c 0 4px, transparent 4px 8px);
}
.backs{display:flex}
.backs .b{width:50px; height:71px; margin-left:-22px}
.backs .b:first-child{margin-left:0}

.trumpbadge{position:absolute; top:16px; left:18px; z-index:3; display:flex; align-items:center;
  gap:10px; background:rgba(9,19,15,.84); border-radius:12px; padding:9px 14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 10px rgba(0,0,0,.28)}
.trumpbadge .s{font-size:28px; line-height:1}
.trumpbadge .k{font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.16em}
.trumpbadge .v{font-size:13px; text-transform:capitalize}
/* The flipped trump card, turned on its side and half off the right edge. right:0 puts its
   centre 43px in and translate(50%) pushes it back onto the edge, so exactly half of the
   rotated card stays on the felt. --cw/--ch are pinned so it never shrinks with the hand. */
.trumpcard{position:absolute; top:50%; right:0; z-index:3;
  --cw:86px; --ch:122px; width:86px; height:122px; pointer-events:none;
  transform:translate(50%,-50%) rotate(270deg)}
.trumpcard .card{box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 2px #1b1f35,
  inset 0 0 0 4px var(--face)}
.trumplabel{position:absolute; right:74px; top:50%; z-index:4; transform:translateY(-50%);
  font-size:9px; text-transform:uppercase; letter-spacing:.16em; color:rgba(255,255,255,.5);
  writing-mode:vertical-rl; text-orientation:mixed}

.deckpile{position:absolute; right:18px; bottom:18px; z-index:3; text-align:center}
.deckpile .b{width:58px; height:82px}
.deckpile .n{font-size:12px; margin-top:7px; color:rgba(255,255,255,.75)}

/* Floats directly on the felt, so this is the one place the heavy outline still earns
   its keep — a soft shadow disappears against the swirl. */
.pop{position:absolute; z-index:9; font-size:40px; font-weight:800; pointer-events:none;
  letter-spacing:.02em; animation:pop 1.05s ease-out forwards;
  text-shadow:1px 0 0 rgba(0,0,0,.8),-1px 0 0 rgba(0,0,0,.8),0 1px 0 rgba(0,0,0,.8),
    0 -1px 0 rgba(0,0,0,.8),0 3px 12px rgba(0,0,0,.55)}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.7); opacity:0}
  22%{transform:translate(-50%,-8px) scale(1.14); opacity:1}
  100%{transform:translate(-50%,-64px) scale(1); opacity:0}}
.pop.good{color:#8ff0a6} .pop.bad{color:#ff9186}

/* ============================================================ overlays */
.ov{position:absolute; inset:0; z-index:20; display:grid; place-items:center;
  background:rgba(6,14,11,.52); animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.ov .box{background:var(--panel); border-radius:16px; padding:26px 30px; min-width:380px;
  max-width:610px; text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08)}
.ov h2{font-size:25px; font-weight:800; margin-bottom:8px; letter-spacing:-.005em}
.ov p{font-size:13px; color:#c3cbd6; font-weight:600; line-height:1.65; margin-bottom:14px;
  letter-spacing:.005em}
.bidrow{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:10px 0 4px}
.bidbtn{width:58px; height:58px; font-size:22px; font-weight:800; padding:0}
.bidbtn.no{background:rgba(0,0,0,.24); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  color:#5d6673; text-decoration:line-through; cursor:not-allowed}
.bidbtn.no:hover{filter:none} .bidbtn.no:active{transform:none; filter:none}
.suitrow{display:flex; gap:11px; justify-content:center; margin:12px 0}
.suitbtn{width:72px; height:72px; font-size:34px; background:var(--face); position:relative}
/* Both keys that work, stacked in the corner: the position, and the suit's own letter. */
.suitkey{position:absolute; top:4px; right:6px; font-style:normal; line-height:1.05;
  text-align:right; font-size:10px; font-weight:800; color:#8a929c}
.tbl{width:100%; font-size:14px; margin:12px 0 14px; border-collapse:separate; border-spacing:0 5px}
.tbl th{font-size:9px; color:var(--dim); padding:2px 8px; text-transform:uppercase;

.tbl td{padding:9px 8px; background:rgba(0,0,0,.24); font-weight:700}
.tbl td:first-child{border-radius:5px 0 0 5px; text-align:left}
.tbl td:last-child{border-radius:0 5px 5px 0}
.good{color:#8ff0a6} .bad{color:#ff9186}

  letter-spacing:.005em; max-height:56vh; overflow:auto; padding-right:10px; color:#dde3ea}
.rules h3{font-size:9.5px; margin:15px 0 4px; color:#f6c860; letter-spacing:.16em;
  text-transform:uppercase; font-weight:800}

.rules b{color:#fff}

  max-height:66vh; overflow:hidden; display:flex; flex-direction:column-reverse}
.log div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.log .rd{color:rgba(255,255,255,.78); margin-top:5px}

/* ---- solver overlay ---- */
.solver{display:none; position:absolute; top:16px; right:18px; z-index:22; width:224px;

.solver.on, .sv-open.on{display:block}

.sv-head span{font-size:9px; text-transform:uppercase; letter-spacing:.16em; color:#8fc3ab}
.sv-head button{background:none; box-shadow:none; padding:0 4px; font-size:16px; line-height:1;
  color:#7f8b96; border-radius:4px}

.sv-w{flex:0 0 32px; text-align:right; font-variant-numeric:tabular-nums; font-size:10px;

/* ---- post-trick review ---- */
.ov.review .box{text-align:left; width:min(500px,calc(100vw - 28px))}
.rv{margin:4px 0 2px; max-height:46vh; overflow-y:auto; padding-right:4px}
.rv-row{display:grid; grid-template-columns:76px auto; gap:2px 10px; padding:9px 11px;
  border-radius:8px; margin-bottom:7px; background:rgba(0,0,0,.24);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}

.rv-row.bad{box-shadow:inset 0 0 0 1px rgba(255,145,134,.32)}

  align-self:center}

.rv-v i{font-style:normal; font-size:11.5px; color:#9aa4b2; margin-left:5px}
.rv-row.ok .rv-v{color:#8ff0a6} .rv-row.bad .rv-v{color:#ff9186}
.rv-note{grid-column:2; font-size:11px; font-weight:600; color:#c3cbd6; line-height:1.5}

.rv-copy{flex:0 0 auto!important; padding-left:16px; padding-right:16px}
.sv-open{display:none; position:absolute; top:16px; right:18px; z-index:22; padding:7px 13px; font-size:10px;
  text-transform:uppercase; letter-spacing:.12em; background:rgba(8,18,14,.72)}
/* ============================================================ narrow screens
   Two steps. Under 920px the sidebar stops being a column beside the table and becomes a
   strip of panels underneath it, so the felt keeps the full width. Under 620px — phones —
   the strip is trimmed to the four things you actually need mid-hand, everything anchored
   to a felt corner is pulled in, and the solver becomes a panel over the opponent's end of
   the table rather than a column stealing a quarter of the screen.
   Card sizes are not set here: render() measures the felt and solves for them, because the
   hand has to fit eight cards at any width. */
@media (max-width:920px){
  #app{flex-direction:column; height:100dvh; padding:9px; gap:9px}
  .felt{order:1; min-height:0}
  .side{order:2; width:auto; flex:0 0 auto; flex-direction:row; align-items:stretch;
    overflow-x:auto; overflow-y:hidden; gap:8px; padding-bottom:2px}
  .side > .panel{min-width:max-content}
  .spacer{display:none}
  .side > button{align-self:center; white-space:nowrap; padding:11px 14px}
  .blind h1{font-size:16px; padding:7px 12px 6px}
  .blind-body{padding:8px; gap:8px}
  .chip{width:46px; height:46px; flex-basis:46px; font-size:9.5px}
  .zone.opp{height:auto; padding-top:10px} .zone.mine{height:auto; padding-bottom:10px}
}
@media (max-width:620px){
  #app{padding:6px; gap:6px}
  .side{gap:6px}
  .panel.grid{display:none}            /* tricks left / they bid / round / unseen */
  .log{display:none}                   /* the felt tells the same story with less room */
  .blind h1{font-size:14px}
  .side > button{font-size:11px; padding:10px 12px}
  .trumpbadge{top:8px; left:8px; padding:6px 9px; gap:7px}
  .trumpbadge .s{font-size:20px} .trumpbadge .v{font-size:11px}
  /* The trump card is deliberately half-tucked under the right edge of the felt. On a
     desktop it tucks under the felt and the page shows behind it; on a phone the felt edge
     is six pixels from the screen, so the same treatment gets cut off by the display rather
     than tucked. Smaller and fully on-screen here. Rotated 270deg, a 48px card occupies 68px
     of width, which clears the right trick slot by twenty pixels. */
  .trumpcard{--cw:48px; --ch:68px; width:48px; height:68px; right:8px;
    transform:translate(0,-50%) rotate(270deg)}
  .trumplabel{display:none}
  /* An eight-card fan reaches the bottom-right corner on a phone, so the deck cannot stay
     there — at 48px cards it sat squarely on the last card in the hand. It moves to the top
     right instead, opposite the trump badge and clear of the centred opponent row. */
  .deckpile{top:8px; right:9px; bottom:auto}
  .deckpile .b{width:34px; height:48px}
  .deckpile .n{font-size:9px; margin-top:3px}
  .backs .b{width:36px; height:51px; margin-left:-16px}
  .tag{font-size:10px; padding:5px 11px}
  .zone.mid{gap:18px}
  /* The panel starts closed on a phone, and when opened it sits in the band between the bid
     prompt and the hand rather than over either. Anchoring it to the hand's own height keeps
     that true at every round size, since the cards grow as the hand shrinks. */
  .solver{top:auto; bottom:calc(var(--ch) + 46px); left:8px; right:8px; width:auto;
    max-height:34vh; overflow-y:auto}
  .sv-open{top:auto; bottom:calc(var(--ch) + 46px); right:8px}
  .ov{align-items:end; padding:0 0 10px}
  .ov .box{min-width:0; width:calc(100vw - 28px); max-width:none; padding:16px 14px;
    max-height:56vh; overflow-y:auto}
  /* The title screen is a tall stack — card, hint, then the setup that unfolds under it — so
     it must stay centred and be allowed to scroll. Bottom-aligning it the way the other
     dialogs are pushed the difficulty buttons clean off the bottom of the felt. */
  .ov.start{align-items:center; padding:10px}
  .startwrap{gap:11px; max-height:100%; overflow-y:auto}
  .startcard{width:132px; height:188px}
  .ov.start.ready .startsetup{max-height:300px; padding:14px 18px 16px}
  .startsetup{width:min(400px,94vw)}
  .startsetup .bidbtn{height:38px; padding:0 14px; font-size:13px}
  .starthint{font-size:11px}
  .startnote{font-size:10.5px; margin-top:11px}

  /* The bid prompt is the one dialog that must never cover the hand: it pins to the top of
     the felt and shrinks instead of growing downward. */
  .ov.bid{align-items:flex-start; padding:0 8px}
  .ov.bid .box{margin-top:8px; width:calc(100vw - 16px); max-height:none; padding:12px 13px}
  .bidhead{gap:12px; margin-bottom:10px}
  .bidnum{padding:3px 12px 5px} .bignum{font-size:36px}
  .bidmain{font-size:13px} .bidhook{font-size:10.5px}
  .ov.bid .bidrow{gap:7px; margin-bottom:9px}
  .ov.bid .bidbtn{width:42px; height:42px; font-size:17px}
  .bidfoot{font-size:10.5px}
  .ov h2{font-size:20px} .ov p{font-size:12px}
  .bidbtn{width:48px; height:48px; font-size:18px}
  .suitbtn{width:58px; height:58px; font-size:27px}
  .rules{max-height:62vh; font-size:12px}
}
/* No hover on a touch screen, so the lift has to come from the press instead, and the
   browser must not treat a quick tap on a card as a double-tap zoom. */
@media (hover:none){
  .card.playable:hover{transform:rotate(var(--tilt,0deg))!important; filter:none}
  .card.playable{touch-action:manipulation}
  .card.playable:active{transform:translateY(-16px) scale(1.05)!important; z-index:9}
  button{touch-action:manipulation}
  button:hover{filter:none}
}

<body class="preboot">

<script>
"use strict";
/* ==========================================================================
   ENGINE — 24 cards: 10 J Q K A in four suits, two Wizards, two Jesters.
   Card ints: 0..19 normal (suit = c/5, rank = c%5), 20-21 Wizards, 22-23 Jesters.
   ========================================================================== */
const NUM_SUITS=4, NUM_RANKS=5, NUM_NORMAL=20;
const FIRST_WIZARD=20, FIRST_JESTER=22, DECK_SIZE=24, NO_TRUMP=-1;
const RANKS=["10","J","Q","K","A"], SUITS=["♠","♥","♦","♣"];
const SUIT_WORDS=["spades","hearts","diamonds","clubs"];
const DECK=[...Array(DECK_SIZE).keys()];

const suitOf  = c => c<NUM_NORMAL ? (c/NUM_RANKS)|0 : -1;
const rankOf  = c => c<NUM_NORMAL ? c%NUM_RANKS : -1;
const isWizard= c => c>=FIRST_WIZARD && c<FIRST_JESTER;
const isJester= c => c>=FIRST_JESTER;
const cardName= c => isWizard(c)?"Wizard" : isJester(c)?"Jester" : RANKS[c%NUM_RANKS]+SUITS[(c/NUM_RANKS)|0];

/* Test order encodes the duplicate-card rules: a Wizard LEAD is checked before a
   Wizard FOLLOW (first Wizard played wins); a Jester FOLLOW before a Jester LEAD
   (two Jesters go to the leader). Reordering silently changes the game. */
function trickWinner(lead, follow, trump){
  if(isWizard(lead))   return 0;
  if(isWizard(follow)) return 1;
  if(isJester(follow)) return 0;
  if(isJester(lead))   return 1;
  const ls=suitOf(lead), fs=suitOf(follow);
  if(trump>=0){
    if(fs===trump && ls!==trump) return 1;
    if(ls===trump && fs!==trump) return 0;
  }
  return (fs===ls && rankOf(follow)>rankOf(lead)) ? 1 : 0;
}
function legalPlays(hand, lead){
  if(lead===null) return hand.slice();
  const s=suitOf(lead);
  if(s<0) return hand.slice();                        // Wizard/Jester led: no suit
  const follow=hand.filter(c=>suitOf(c)===s);
  if(!follow.length) return hand.slice();
  return follow.concat(hand.filter(c=>c>=NUM_NORMAL)); // specials always legal
}
const roundScore = (bid,tricks) => tricks===bid ? 2+tricks : -Math.abs(tricks-bid);
function legalBids(size, isDealer, oppBid){
  const all=[...Array(size+1).keys()];
  if(!isDealer || oppBid===null) return all;
  return all.filter(b => b !== size-oppBid);          // the hook
}
const PEAK=8;
function ladderFor(peak){
  const up=[...Array(peak).keys()].map(i=>i+1);
  return up.concat(up.slice().reverse());             // peak twice keeps the deal fair
}

/* ==========================================================================
   SOLVER — exact alpha-beta over a fully specified deal, bitmask hands,
   transposition table with EXACT/LOWER/UPPER bound flags.
   ========================================================================== */
const EXACT=0, LOWER=1, UPPER=2;
const SUIT_MASK=[], maskOf=cs=>cs.reduce((m,c)=>m|(1<<c),0);
for(let s=0;s<NUM_SUITS;s++){let m=0;for(let c=0;c<NUM_NORMAL;c++)if(((c/NUM_RANKS)|0)===s)m|=1<<c;SUIT_MASK.push(m);}
let SPECIALS=0; for(let c=NUM_NORMAL;c<DECK_SIZE;c++) SPECIALS|=1<<c;

function legalMask(hand, lead){
  if(lead===null || lead>=NUM_NORMAL) return hand;
  const f=hand & SUIT_MASK[(lead/NUM_RANKS)|0];
  return f ? (f | (hand & SPECIALS)) : hand;
}
const tricksPayoff = at => at;
const scorePayoff = (bidA,bidB) => (at,bt) => roundScore(bidA,at)-roundScore(bidB,bt);

class DoubleDummy{
  constructor(trump, payoff, budget=400000){
    this.trump=trump; this.payoff=payoff; this.budget=budget; this.nodes=0;
    this.tt=new Map(); this.order=DoubleDummy.order(trump);
    /* trickWinner is a chain of branches over the two special ranks and the trump rule. In
       the innermost loop that cost adds up, and the answer only ever depends on the pair, so
       resolve all 576 pairs once per solver instead. */
    this.wins=new Uint8Array(DECK_SIZE*DECK_SIZE);
    for(let l=0;l<DECK_SIZE;l++)
      for(let f=0;f<DECK_SIZE;f++)
        this.wins[l*DECK_SIZE+f] = trickWinner(l,f,trump)===1 ? 1 : 0;
  }
  static order(trump){
    const power=c=>{
      if(c>=FIRST_JESTER) return -1;
      if(c>=FIRST_WIZARD) return 100;
      const r=c%NUM_RANKS;
      return (trump>=0 && ((c/NUM_RANKS)|0)===trump) ? r+50 : r;
    };
    return DECK.slice().sort((a,b)=>power(b)-power(a));
  }
  moves(hand, lead){
    const ok=legalMask(hand, lead), out=[];
    for(const c of this.order) if((ok>>>c)&1) out.push(c);
    return out;
  }
  /* Cards you cannot tell apart are one move, not several.
     If two of the mover's legal cards are in the same suit and every rank between them is
     already gone from both hands, the two are interchangeable against everything still live:
     they beat the same cards, lose to the same cards, and the positions they leave behind are
     the same up to renaming. Searching both doubles the work for an identical answer. The
     same holds for the two Wizards and the two Jesters, which are literally identical.
     Only the higher card of each run is kept — an arbitrary but consistent choice.
     This never runs at the root, where every legal card needs its own reported value. */
  static prune(ok, live){
    for(let c=0;c<NUM_NORMAL;c++){
      if(!((ok>>>c)&1)) continue;
      const suit=(c/NUM_RANKS)|0;
      let d=c+1;                                 // step over ranks nobody still holds
      while(d<NUM_NORMAL && ((d/NUM_RANKS)|0)===suit && !((live>>>d)&1)) d++;
      if(d<NUM_NORMAL && ((d/NUM_RANKS)|0)===suit && ((ok>>>d)&1)) ok &= ~(1<<c);
    }
    if((ok>>>FIRST_WIZARD & 1) && (ok>>>(FIRST_WIZARD+1) & 1)) ok &= ~(1<<FIRST_WIZARD);
    if((ok>>>FIRST_JESTER & 1) && (ok>>>(FIRST_JESTER+1) & 1)) ok &= ~(1<<FIRST_JESTER);
    return ok;
  }

  /* Hot path. What is here for speed rather than logic:
       · the table is keyed on numbers rather than a built-up string, and the entry is packed
         into one integer, so a node neither builds a string nor allocates;
       · the entry also carries the move that was best last time. Trying it first is what makes
         alpha-beta cut early, and it is the single largest saving in the search;
       · indistinguishable cards are collapsed to one representative (see prune);
       · trick outcomes come from a precomputed pair table;
       · the move loop walks the fixed power order and tests the mask in place.
     Values are small integers — round scores differ by at most eighteen — so +64 keeps the
     packed form positive, with the move in the next five bits and the bound flag in the low
     two. */
  search(a,b,aMove,lead,at,bt,alpha,beta){
    if(a===0 && b===0) return this.payoff(at,bt);
    if(this.nodes>=this.budget) return this.payoff(at,bt);

    const k1=a*16777216+b;                       // 48 bits: exact in a double
    const k2=(aMove?1:0)|((lead===null?25:lead)<<1)|(at<<6);
    let inner=this.tt.get(k1), ttMove=-1;
    if(inner!==undefined){
      const packed=inner.get(k2);
      if(packed!==undefined){
        const val=(packed>>7)-64, flag=packed&3;
        ttMove=(packed>>2)&31;
        if(flag===EXACT) return val;
        if(flag===LOWER && val>=beta) return val;
        if(flag===UPPER && val<=alpha) return val;
      }
    }
    this.nodes++;
    const a0=alpha, b0=beta, hand=aMove?a:b;
    /* The card on the table counts as live. It is no longer in either hand, but it is still
       being compared against — treating it as gone made a led J look like a hole, so the 10
       and the Q either side of it appeared interchangeable when one loses to it and the other
       beats it. */
    const ok=DoubleDummy.prune(legalMask(hand, lead),
                               (a|b) | (lead===null ? 0 : 1<<lead));
    const order=this.order, wins=this.wins;
    let best=aMove?-Infinity:Infinity, bestMove=31, v;

    /* The stored move first, then the power order skipping it. */
    for(let oi=-1; oi<order.length; oi++){
      const card = oi<0 ? ttMove : order[oi];
      if(card<0 || card>=DECK_SIZE) continue;
      if(oi>=0 && card===ttMove) continue;
      if(!((ok>>>card)&1)) continue;
      const bit=1<<card;
      if(lead===null){
        v = aMove ? this.search(a^bit,b,false,card,at,bt,alpha,beta)
                  : this.search(a,b^bit,true ,card,at,bt,alpha,beta);
      }else{
        const fw = wins[lead*DECK_SIZE+card]===1;
        v = aMove ? this.search(a^bit,b, fw,null,at+(fw?1:0),bt+(fw?0:1),alpha,beta)
                  : this.search(a,b^bit,!fw,null,at+(fw?0:1),bt+(fw?1:0),alpha,beta);
      }
      if(aMove){ if(v>best){best=v; bestMove=card;} if(best>alpha)alpha=best; }
      else     { if(v<best){best=v; bestMove=card;} if(best<beta )beta =best; }
      if(alpha>=beta) break;
    }
    if(inner===undefined){ inner=new Map(); this.tt.set(k1, inner); }
    inner.set(k2, ((best+64)<<7) | (bestMove<<2)
                | (best<=a0?UPPER : best>=b0?LOWER : EXACT));
    return best;
  }
  /* One solver instance is reused across all the determinizations of a single decision, so
     the node budget has to be per determinization. Sharing it meant an eight-card solve
     burned the whole 400k by the twenty-sixth sample and every sample after that returned
     payoff(at,bt) without searching at all — a constant that dragged every option's average
     toward the same number. The table is kept across samples, which is sound because its
     keys carry both hands, and only cleared when it gets big enough to cost memory. */
  reset(){
    this.nodes=0;
    if(this.tt.size>60000) this.tt.clear();      // outer buckets, each holding a few entries
  }
  value(a,b,aMove=true,lead=null,at=0,bt=0){
    this.reset();
    return this.search(a,b,aMove,lead,at,bt,-Infinity,Infinity);
  }
  /* Each root move gets a full window: alpha-beta would return a bound for all but
     the best, and PIMC averages these across determinizations. */
  rootValues(a,b,lead=null,at=0,bt=0){
    this.reset();
    const out=new Map();
    for(const card of this.moves(a,lead)){
      const bit=1<<card;
      if(lead===null) out.set(card,this.search(a^bit,b,false,card,at,bt,-Infinity,Infinity));
      else{
        const w=trickWinner(lead,card,this.trump)===1;
        out.set(card,this.search(a^bit,b,w,null,at+(w?1:0),bt+(w?0:1),-Infinity,Infinity));
      }
    }
    return out;
  }
}

/* ==========================================================================
   BOT — PIMC: guess their hand many times, solve each exactly, average.
   Not GTO (strategy fusion, non-locality) but strong in trick-taking games.
   ========================================================================== */
const rnd = n => Math.floor(Math.random()*n);
function sampleFrom(pool, k){
  const a=pool.slice();
  for(let i=0;i<k;i++){ const j=i+rnd(a.length-i); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0,k);
}
const DIFFICULTY={ easy:0, medium:14, hard:34 };

function leadWinProb(card, unseen, trump){
  if(!unseen.length) return 0;
  return unseen.filter(x=>trickWinner(card,x,trump)===0).length / unseen.length;
}
const cardPower=(c,trump)=> c>=FIRST_JESTER ? -1 : c>=FIRST_WIZARD ? 100
  : (trump>=0 && ((c/NUM_RANKS)|0)===trump ? (c%NUM_RANKS)+50 : c%NUM_RANKS);

function heuristicBid(hand, unseen, trump, legal, size){
  let est=hand.reduce((s,c)=>s+leadWinProb(c,unseen,trump),0);
  const wiz=hand.filter(isWizard).length, jes=hand.filter(isJester).length;
  est=Math.min(Math.max(est,wiz), size-jes);
  return legal.slice().sort((x,y)=>Math.abs(x-est)-Math.abs(y-est) || y-x)[0];
}
function heuristicPlay(hand, legal, lead, trump, bid, took, unseen){
  if(legal.length===1) return legal[0];
  const want = bid-took > 0;
  if(lead!==null){
    const win=legal.filter(c=>trickWinner(lead,c,trump)===1);
    const lose=legal.filter(c=>trickWinner(lead,c,trump)===0);
    if(want) return (win.length?win:lose).sort((a,b)=>cardPower(a,trump)-cardPower(b,trump))[0];
    if(lose.length) return lose.sort((a,b)=>cardPower(b,trump)-cardPower(a,trump))[0];
    return win.sort((a,b)=>cardPower(a,trump)-cardPower(b,trump))[0];
  }
  if(want) return legal.slice().sort((a,b)=>cardPower(b,trump)-cardPower(a,trump))[0];
  const je=legal.filter(isJester);
  if(je.length) return je[0];
  return legal.slice().sort((a,b)=>leadWinProb(a,unseen,trump)-leadWinProb(b,unseen,trump))[0];
}

function botBid(hand, unseen, oppSize, trump, iLead, oppBid, legal, size, samples){
  if(!samples) return heuristicBid(hand, unseen, trump, legal, size);
  const dd=new DoubleDummy(trump, tricksPayoff), hm=maskOf(hand), counts=[];
  for(let i=0;i<samples;i++)
    counts.push(Math.round(dd.value(hm, maskOf(sampleFrom(unseen,oppSize)), iLead)));
  let best=legal[0], bv=-Infinity;
  for(const b of legal){
    let v=0;
    for(const t of counts) v += oppBid===null ? roundScore(b,t)
                                              : roundScore(b,t)-roundScore(oppBid,size-t);
    v/=counts.length;
    if(v>bv){ bv=v; best=b; }
  }
  return best;
}
function botPlay(hand, oppSize, unseen, voids, trump, myBid, oppBid, myT, oppT, lead, legal, samples){
  if(legal.length===1) return legal[0];
  if(!samples) return heuristicPlay(hand, legal, lead, trump, myBid, myT, unseen);
  let pool = voids.size ? unseen.filter(c=>!voids.has(suitOf(c))) : unseen;
  if(pool.length<oppSize) pool=unseen;
  const dd=new DoubleDummy(trump, scorePayoff(myBid,oppBid)), hm=maskOf(hand);
  const total=new Map(legal.map(c=>[c,0]));
  for(let i=0;i<samples;i++){
    const vals=dd.rootValues(hm, maskOf(sampleFrom(pool,oppSize)), lead, myT, oppT);
    for(const c of legal) if(vals.has(c)) total.set(c, total.get(c)+vals.get(c));
  }
  let best=legal[0], bv=-Infinity;
  for(const c of legal){ const v=total.get(c); if(v>bv){ bv=v; best=c; } }
  return best;
}

/* ==========================================================================
   CARD ART — every face is one SVG on a 100x140 viewBox, so it scales exactly with
   the card and never degrades when a big hand shrinks the cards.

   Ranks are typographic: a serif letterform inside a hairline double frame. That is
   what keeps K, Q and J apart at 70px wide, where drawn figures turn to mush.
   Wizards and Jesters are line drawings instead — the four cards that break the suit
   system should not look like they belong to it.
   ========================================================================== */
/* Four-colour deck. Two sets: SUIT_INK is tuned for the cream card face, SUIT_GLOW for
   the dark felt, where the card inks would go muddy. */
/* Diamonds are a deep amber rather than a true yellow: pure yellow cannot clear 3:1
   against the cream card face, and the corner indices are small type. */
const SUIT_INK  = ["#2b3a67", "#d6302f", "#b8840a", "#1e7a4b"];
const SUIT_GLOW = ["#dfe6f2", "#ff9186", "#f5c542", "#5fd39a"];
const GOLD_INK="#d4a53a";
const inkOf = s => SUIT_INK[s];

const frameSVG = c => `
  <rect x="9" y="9" width="82" height="122" rx="4" fill="none" stroke="${c}"
        stroke-width="1" opacity=".28"/>
  <rect x="13" y="13" width="74" height="114" rx="2" fill="none" stroke="${c}"
        stroke-width=".6" opacity=".2"/>`;

/* One treatment for all five ranks. "10" is two glyphs, so it drops a size to keep the
   same optical width as a single letter; the Ace gives its suit more weight. Nothing else
   varies, which is what makes the ranks read as one set. */
/* Advance widths of every glyph as Georgia actually renders it, in viewBox units.
   text-anchor="middle" has to measure the string before it can centre it, and until the font
   is ready that measurement is wrong — so the rank drew from the centre rightwards and the
   card clipped it, correcting a moment later when the font landed. Pinning textLength gives
   the browser the advance up front, so the very first paint is centred whatever font is in
   use. The numbers are Georgia's own, so nothing about the drawing changes. */
const RANK_W = { "10":59.72, "J":38.19, "Q":52.56, "K":52.38, "A":48.63 };
const SUIT_W = { "♠":10.19, "♥":11.38, "♦":9.78, "♣":12.56 };

function rankSVG(label, suit, c){
  const wide = label.length > 1;
  const sw = (SUIT_W[suit] || 11) * (label === "A" ? 26/19 : 1);
  return `<svg viewBox="0 0 100 140">${frameSVG(c)}
    <text x="50" y="${wide?81:84}" text-anchor="middle" fill="${c}"
          font-family="Georgia,'Times New Roman',serif" font-size="${wide?50:64}"
          textLength="${RANK_W[label] || 48}" lengthAdjust="spacingAndGlyphs">${label}</text>
    <line x1="31" y1="95" x2="69" y2="95" stroke="${c}" stroke-width=".9" opacity=".38"/>
    <text x="50" y="117" text-anchor="middle" fill="${c}"
          font-family="Georgia,serif" font-size="${label==="A"?26:19}"
          textLength="${sw.toFixed(2)}" lengthAdjust="spacingAndGlyphs">${suit}</text>
  </svg>`;
}

/* Wizard — stroked cone and brim, solid jewel at the tip, sparks around it. */
/* The cone sits in front of the brim. Line art has no fill, so "in front" cannot come from
   draw order — the ring is masked by the cone instead, which cuts it away where the cone
   crosses and lets the cone keep its whole triangle, base line included. The mask strokes
   the cone wider than the line itself, leaving a hairline of air around it; that gap is what
   reads as one shape passing over another rather than the two simply meeting.
   Every instance gets a fresh mask id: several of these can be in the document at once, and
   duplicate ids would leave every card pointing at the first card's mask. */
const BRIM_PATH = "M27 89 C27 84 38 81 50 81 C62 81 73 84 73 89 C73 94 62 97 50 97 "
                + "C38 97 27 94 27 89 Z";
const CONE_PATH = "M50 32 L69 88 L31 88 Z";
let svgUid = 0;

const wizardSVG = () => { const u = "wz" + (++svgUid); return `
<svg viewBox="0 0 100 140">

        stroke-width=".8" opacity=".4"/>

     stroke-linecap="round">

    <path d="${CONE_PATH}"/>
  </g>
  <circle cx="50" cy="27" r="4.2" fill="${GOLD_INK}"/>
  <path d="M46 60 L48 67 L55 69 L48 71 L46 78 L44 71 L37 69 L44 67 Z" fill="${GOLD_INK}"/>

/* Jester — same construction language as the Wizard: one frame rect, one stroke weight,
   closed outlines with nothing filled but the bells, the same serif label on the same
   baseline, and the Wizard's brim path underneath.

   The three prongs are not hand-drawn outlines. Each is a centreline swept with a width that
   eases to nothing at the tip, and the outline is that sweep's two offset edges. Drawing a
   prong the obvious way — up one side to the crest, back down the outside, then up the inside
   again — makes the descending edge cross the ascending one, which is where the folded-over
   look came from. A sweep cannot do that as long as the curve never bends tighter than its
   own half-width.

   Three things are deliberate and worth not breaking:
     · the roots sit at 42 / 50 / 58 before narrowing, symmetric about the centre line even
       though the middle prong's tip hooks right;
     · the right prong is the left one reflected about x = 50, so they are identical by
       construction rather than by eye;
     · depth order is right behind middle behind left. Outlines have no fill, so that cannot
       come from draw order — each prong is masked by whatever sits in front of it, and the
       mask strokes the occluder wider than the line to leave a hairline of air.

   NARROW squeezes the centrelines before they are swept, not the finished paths: squeezing
   the drawing would also thin every near-vertical part of a prong and undo the widths below.
   Every instance gets fresh ids; duplicates would point every card at the first card's mask. */
const JES_INK="#5b3b8f";
const JES_NARROW=0.82, JES_MID_W=21, JES_PRONG_W=13;
const ABOVE_BRIM = "M0 0 L100 0 L100 89 L73 89 C73 84 62 81 50 81 C38 81 27 84 27 89 L0 89 Z";

function jesSweep(pts, w0, w1, steps=44){
  const [p0,c1,c2,p3]=pts.map(([x,y])=>[50+(x-50)*JES_NARROW, y]);
  const at=t=>{const u=1-t;return[
    u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],
    u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]];};
  const d1=t=>{const u=1-t;return[
    3*u*u*(c1[0]-p0[0])+6*u*t*(c2[0]-c1[0])+3*t*t*(p3[0]-c2[0]),
    3*u*u*(c1[1]-p0[1])+6*u*t*(c2[1]-c1[1])+3*t*t*(p3[1]-c2[1])];};
  const L=[],R=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps,[x,y]=at(t),[dx,dy]=d1(t);
    const len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    const w=(w0+(w1-w0)*Math.pow(t,0.7))/2;
    L.push([x+nx*w,y+ny*w]); R.push([x-nx*w,y-ny*w]);
  }
  const f=n=>Math.round(n*100)/100;
  return "M"+L.concat(R.reverse()).map(([x,y])=>f(x)+" "+f(y)).join(" L")+" Z";
}
const jesMirror = d => { let i=0;
  return d.replace(/-?\d*\.?\d+/g, m =>
    String(Math.round(((i++%2===0) ? 100-parseFloat(m) : parseFloat(m))*100)/100));
};
const jesNX = x => Math.round((50+(x-50)*JES_NARROW)*100)/100;

const JES_L = jesSweep([[42,86],[34,57],[18,53],[16,70]], JES_PRONG_W, JES_PRONG_W*0.13);
const JES_R = jesMirror(JES_L);
const JES_M = jesSweep([[50,86],[48,60],[52,32],[64,30]], JES_MID_W,   JES_MID_W*0.12);

const jesterSVG = () => { const u="js"+(++svgUid); return `
