/* ==========================================================================
   GAME STATE + FLOW  (seat 0 = you, seat 1 = bot; dealer alternates)
   ========================================================================== */
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let G=null, pendingCard=null, difficulty="medium";

/* Which of the four hotkey treatments to draw: k1 corner pip, k2 keycap below the card,

/* runRound is a long async chain that awaits human input. Starting a second one while the
   first is parked on a promise leaves two chains mutating the same G — which is exactly the
   bug where a round played itself out while the bid prompt was still on screen. Every game
   gets a generation token and a chain retires as soon as it is no longer the current one. */
let GEN = 0;
const stale = gen => !G || G.gen !== gen;

function newGame(){
  GEN++;
  pendingCard = null;                                   // drop any parked click handler
  document.querySelectorAll(".ov").forEach(o=>o.remove());
  G={ gen:GEN, ladder:ladderFor(PEAK), idx:0, totals:[0,0], logLines:[] };
  $("log").innerHTML="";
  runRound();
}
function unseenFor(seat){
  const seen=new Set(G.hands[seat]); seen.add(G.trumpCard);
  for(const c of G.played) seen.add(c);
  if(G.table[1-seat]!==null) seen.add(G.table[1-seat]);
  return DECK.filter(c=>!seen.has(c));
}
/* Newest first in the array; the log is column-reverse, so the newest line sits at the
   bottom near the action and the oldest gets clipped off the top. */
function say(t, isRound){
  G.logLines.unshift({t, rd:!!isRound});
  $("log").innerHTML=G.logLines.slice(0,26)
    .map(l=>`<div class="${l.rd?"rd":""}">${l.rd?"":"› "}${l.t}</div>`).join("");
}

async function runRound(){
  const gen=G.gen;
  const size=G.ladder[G.idx], dealer=G.idx%2, lead=1-dealer;
  const cards=DECK.slice();
  for(let i=cards.length-1;i>0;i--){ const j=rnd(i+1); const t=cards[i]; cards[i]=cards[j]; cards[j]=t; }
  G.size=size; G.dealer=dealer; G.leadSeat=lead;
  G.hands=[cards.slice(0,size).sort((a,b)=>a-b), cards.slice(size,2*size).sort((a,b)=>a-b)];
  G.trumpCard=cards[2*size];
  G.bids=[null,null]; G.tricks=[0,0]; G.played=[]; G.table=[null,null];
  G.voids=new Set();                    // suits YOU have shown a void in (bot's read)
  G.myVoids=new Set();                  // suits THEY have shown a void in (your read)
  G.trickNo=0; G.leader=lead; G.thinking=false;
  G.freshDeal=true; G._dealSeq=(G._dealSeq||0)+1;   // animate this deal once, then stop
  G._from=[null,null];                          // where each side's card started this trick
  // Decisions awaiting the end-of-round review. reviewPending holds the solves still in
  // flight, so the summary can wait for them instead of losing whatever had not finished.
  G.review=[]; G.reviewPending=[]; G._reviewSeq=0; G._evPromise=null;
  G.handDealt=G.hands[0].slice();               // hands are consumed in play; keep the deal
  G.trickLog=[];
  G.logLines=[]; $("log").innerHTML="";         // the log is a record of this round only

  // Only the flipped-Wizard case needs a render before trump is known — naming trump is a
  // decision about your own cards, so you have to see them first. Every other round renders
  // exactly once here, which matters: render() rebuilds the hand, so a second call moments
  // after the first threw away the deal animation the first one had just started.
  G.trump=NO_TRUMP;
  if(isWizard(G.trumpCard)){
    render();
    G.trump = dealer===0 ? await askTrump() : botNameTrump();
    if(stale(gen)) return;
    G.freshDeal=true; G._dealSeq++;       // the post-trump render deals again, deliberately
  }
  else if(!isJester(G.trumpCard)) G.trump=suitOf(G.trumpCard);

  render();
  say(`Round ${G.idx+1}: ${size} card${size>1?"s":""}, trump `
      + `${G.trump<0?"none":SUIT_WORDS[G.trump]} (${cardName(G.trumpCard)} up)`, true);
  await sleep(360 + size*160);          // let the deal finish before anyone is asked to bid
  if(stale(gen)) return;

  for(const seat of [lead, dealer]){                 // non-dealer bids first
    const legal=legalBids(size, seat===dealer, G.bids[1-seat]);
    if(seat===0){
      G.bids[0]=await askBid(legal);
      if(stale(gen)) return;
    }else{
      // Flip the flag and yield a frame first: the search is synchronous and blocks
      // the thread, so the indicator has to be painted before it starts.
      G.thinking=true; render(); await sleep(340);
      if(stale(gen)) return;
      G.bids[1]=botBid(G.hands[1], unseenFor(1), size, G.trump, seat===lead,
                       G.bids[0], legal, size, DIFFICULTY[difficulty]);
      G.thinking=false;
      say(`They bid ${G.bids[1]}`);
    }
    render();
  }

  for(let t=0;t<size;t++){
    G.trickNo=t; G.table=[null,null];
    const follower=1-G.leader;
    for(const seat of [G.leader, follower]){
      const leadCard = seat===follower ? G.table[G.leader] : null;
      const legal=legalPlays(G.hands[seat], leadCard);
      let card;
      if(seat===0){
        card=await askCard(legal);
        if(stale(gen)) return;
        if(legal.length>1 && G._evPromise){
          // Filed when the solve lands rather than now, so playing quickly never costs you
          // the analysis, and the game is never made to wait for it either.
          const p=G._evPromise, label=`Trick ${t+1}`, played=card, g=gen, seq=G._reviewSeq++;
          G.reviewPending.push(p.then(r=>{
            if(!stale(g) && r && r.rows && r.rows.length)
              fileReview({ seq, label, grade:gradeRows(r.rows, played), facts:plain(r._why) });
          }).catch(()=>{}));
        }
        G._evPromise=null;
      }else{
        G.thinking=true; render(); await sleep(300);
        if(stale(gen)) return;
        card=botPlay(G.hands[1], G.hands[0].length, unseenFor(1), G.voids, G.trump,
                     G.bids[1], G.bids[0], G.tricks[1], G.tricks[0], leadCard, legal,
                     DIFFICULTY[difficulty]);
        G.thinking=false;
      }
      // voids each side may legally infer about the other
      if(leadCard!==null && suitOf(leadCard)>=0 && card<NUM_NORMAL
         && suitOf(card)!==suitOf(leadCard)){
        (seat===0 ? G.voids : G.myVoids).add(suitOf(leadCard));
      }
      // measure where the card is sitting now; render() is about to destroy that element
      G._from[seat]=grabSource(seat, card);
      G.hands[seat]=G.hands[seat].filter(c=>c!==card);
      G.table[seat]=card;
      render();
      await sleep(seat===0?160:420);
      if(stale(gen)) return;
    }
    const followerWon=trickWinner(G.table[G.leader], G.table[follower], G.trump)===1;
    const winner=followerWon?follower:G.leader;
    G.trickLog.push({ n:t+1, iLed:G.leader===0, mine:G.table[0], theirs:G.table[1],
                      won:winner===0 });
    G.tricks[winner]++;
    G.played.push(G.table[0], G.table[1]);
    render();
    popup(winner===0?"+1 TRICK":"THEIRS", winner===0);
    say(`Trick ${t+1}: ${cardName(G.table[0])} vs ${cardName(G.table[1])}, ${winner===0?"you":"they"} take it`);
    await sleep(900);
    if(stale(gen)) return;
    G.leader=winner; G.table=[null,null]; render();
  }

  const sc=[roundScore(G.bids[0],G.tricks[0]), roundScore(G.bids[1],G.tricks[1])];
  G.totals[0]+=sc[0]; G.totals[1]+=sc[1];
  render();
  await showRoundEnd(sc);
  if(stale(gen)) return;
  await showRoundReview();
  if(stale(gen)) return;

  G.idx++;
  if(G.idx>=G.ladder.length) showGameOver();
  else runRound();
}
function botNameTrump(){
  const len=[0,0,0,0], pow=[0,0,0,0];
  for(const c of G.hands[1]){ const s=suitOf(c); if(s>=0){ len[s]++; pow[s]+=rankOf(c)+1; } }
  let best=0; for(let s=1;s<4;s++) if(len[s]>len[best]||(len[s]===len[best]&&pow[s]>pow[best])) best=s;
  return best;
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function cardEl(c, playable, dim, tilt, anim, delay){
  const d=document.createElement("div");
  d.className="card"+(anim?" predeal":"")+(isWizard(c)?" sp":"")+(isJester(c)?" je":"")
    +(playable?" playable":"")+(dim?" dim":"");
  d.style.setProperty("--tilt",(tilt||0)+"deg");
  d.dataset.c=c;                                          // so the EV tag can find its card
  if(anim && delay) d.style.animationDelay=delay+"ms";
  if(c < NUM_NORMAL) d.style.color=SUIT_INK[suitOf(c)];   // corner indices match the suit

  if(isWizard(c))      d.innerHTML=wizardSVG();
  else if(isJester(c)) d.innerHTML=jesterSVG();
  else{
    const r=RANKS[rankOf(c)], s=SUITS[suitOf(c)], ink=inkOf(suitOf(c));
    d.innerHTML=rankSVG(r, s, ink)
      +`<div class="cnr tl">${r}<i>${s}</i></div><div class="cnr br">${r}<i>${s}</i></div>`;
  }
  return d;
}
function render(){
  if(!G) return;
  const size=G.size, mine=G.bids[0], theirs=G.bids[1];
  $("blindTitle").textContent=`Round ${G.idx+1}`;
  $("chipText").innerHTML=`${size}<br>card${size>1?"s":""}`;
  $("roundNo").textContent=`${G.idx+1}/${G.ladder.length}`;
  $("dealerTag").textContent = G.dealer===0 ? "you deal" : "they deal";
  $("myTotal").textContent=G.totals[0];
  $("oppTotal").textContent=G.totals[1];
  $("bidBox").textContent = mine===null?"–":mine;
  $("tookBox").textContent=G.tricks[0];
  $("oppBid").textContent = theirs===null?"–":theirs;
  $("tricksLeft").textContent = size-G.tricks[0]-G.tricks[1];
  $("unseenN").textContent = unseenFor(0).length;
  $("trumpSuit").textContent = G.trump<0?"∅":SUITS[G.trump];
  $("trumpSuit").style.color = G.trump<0?"#fdfbf3":SUIT_GLOW[G.trump];
  $("trumpName").textContent = G.trump<0?"none":SUIT_WORDS[G.trump];
  $("deckN").textContent = DECK_SIZE-2*size-1;

  const cb=$("contractBig");
  if(mine===null){ cb.textContent="-"; cb.className="big o"; $("contractSub").textContent="place a bid"; }
  else{
    const need=mine-G.tricks[0];
    cb.textContent = need===0 ? "✓" : need>0 ? need : "OVER";
    cb.className="big o"+(need===0?" ok":"");
    $("contractSub").textContent = need===0 ? `on ${mine}, duck the rest`
      : need>0 ? `more for +${2+mine}` : `blown by ${-need}`;
  }
  const oppTag=$("oppTag");
  oppTag.innerHTML = G.thinking ? "Opponent is thinking…"
    : theirs===null ? "Opponent"
    : `Opponent: bid <b>${theirs}</b>, taken <b>${G.tricks[1]}</b>`;
  oppTag.style.opacity = G.thinking ? .7 : 1;
  $("myTag").innerHTML = mine===null ? "Your hand"
    : `Your hand: bid <b>${mine}</b>, taken <b>${G.tricks[0]}</b>`;

  // render() runs on every state change, and it rebuilds the DOM each time. Only animate
  // what is actually new, or the whole hand replays the deal on every bot move.
  const fresh = !!G.freshDeal;

  const backs=$("oppBacks"); backs.innerHTML="";
  for(let i=0;i<G.hands[1].length;i++){
    const b=document.createElement("div");
    b.className="b back"+(fresh?" predeal":"");
    b.style.setProperty("--tilt",((i%3-1)*1.6)+"deg");
    b.style.setProperty("--spin",(i%2?-14:14)+"deg");
    // dealer deals to the non-dealer first, then alternates
    if(fresh) b.style.animationDelay=(i*160 + (G.leadSeat===1?0:80))+"ms";
    backs.appendChild(b);
  }
  // A trick slot is only rebuilt when the card in it actually changes. render() runs on
  // every state change — the bot starting to think, a bid landing — and rebuilding here
  // would destroy the element a play animation is running on and snap the card into place.
  for(const [slot,seat] of [["slotMine",0],["slotOpp",1]]){
    const el=$(slot);
    if(el.dataset.shown===String(G.table[seat])) continue;
    el.dataset.shown=String(G.table[seat]);
    el.innerHTML="";
    if(G.table[seat]===null){ el.className="slot"; el.textContent="◆"; }
    else{
      // The frame stays. Dropping it the moment the card was played left the space empty for
      // the whole flight, so the slot looked like it vanished and the card arrived somewhere
      // unrelated. Keeping it gives the card a target to land in; once it lands it covers the
      // frame exactly, since both are one card wide.
      el.className="slot empty";
      const c=cardEl(G.table[seat],false,false,0,false,0);
      el.appendChild(c);
      playAnim(c, G.table[seat], seat);
    }
  }

  const tc=$("trumpCard"); tc.innerHTML="";
  if(G.trumpCard!=null) tc.appendChild(cardEl(G.trumpCard,false,false,0,false,0));

  const h=$("hand");
  const legal = pendingCard ? pendingCard.legal : null;
  const sorted=G.hands[0].slice().sort((a,b)=>(suitOf(a)-suitOf(b))||(a-b));
  // Eight cards at 70px wide need 469px of fan, which no phone has. Solve for the width
  // that fits instead of picking from two fixed sizes: the cards overlap by a fixed
  // fraction, so n cards span cw*(n - OVL*(n-1)) and that has to clear the felt.
  const OVL=.15, n=Math.max(sorted.length,1);
  const avail=Math.max(180, ($("felt").clientWidth||900) - 26);
  const cw=Math.max(34, Math.min(sorted.length<=6?86:70,
                                 Math.floor(avail/(n - OVL*(n-1)))));
  const root=document.documentElement.style;
  root.setProperty("--cw", cw+"px");
  root.setProperty("--ch", Math.round(cw*1.419)+"px");
  root.setProperty("--ovl", Math.round(cw*OVL)+"px");

  // render() runs on every state change, and rebuilding eight SVG-heavy cards each time is
  // both wasted work and a guaranteed way to kill any animation mid-flight. Nothing about
  // the hand can change without changing this signature, so when it matches, leave the DOM
  // exactly where it is.
  const sig=sorted.join(",")+"|"+(legal?legal.join(","):"-")+"|"+cw
          + "|"+(fresh?"deal"+G._dealSeq:"");
  const rebuild = h.dataset.sig!==sig;
  if(rebuild){
  h.dataset.sig=sig;
  h.innerHTML="";
  sorted.forEach((c,i)=>{
    const ok = legal ? legal.includes(c) : false;
    // a little fan, so the hand does not look like a spreadsheet row
    const tilt=(i-(sorted.length-1)/2)*1.7;
    const el=cardEl(c, ok, legal ? !ok : false, tilt, fresh,
                    i*160 + (G.leadSeat===0?0:80));
    el.style.setProperty("--spin",(i%2?14:-14)+"deg");
    // Only while a card is being asked for: during bidding the digits mean bids.
    if(legal && i<9){
      const k=document.createElement("div");
      k.className="hotkey";
      k.textContent=i+1;
      el.appendChild(k);
    }
    if(ok) el.onclick=()=>{
      if(!pendingCard) return;                    // guard against a stale handler
      const r=pendingCard.resolve; pendingCard=null; hideSolver(); r(c);
    };
    const wrap=document.createElement("div");
    wrap.className="cardwrap";
    wrap.dataset.idx=i;                           // this card's phase in the idle bob
    wrap.appendChild(el);
    if(!fresh) startIdle(wrap);                   // a dealt card starts breathing on landing
    h.appendChild(wrap);
  });
  }

  // Cards start hidden, then a frame later we measure where the deck actually is and fly
  // each one in from it. Measuring has to happen after layout, hence the two-step.
  if(fresh && rebuild) dealFrom($("deckPile"));
  G.freshDeal=false;
}

/* ==========================================================================
   PLAYING A CARD — the card travels from where it actually sat to the trick, and how it
   travels says what it is: ordinary cards lift out of the fan and are thrown, a Wizard
   comes down hard, a Jester turns over in the air. The source has to be measured before
   the card leaves the hand, so grabSource runs at play time and playAnim at render time.
   ========================================================================== */
function grabSource(seat, card){
  const el = seat===0 ? $("hand").querySelector(`.card[data-c="${card}"]`)
                      : $("oppBacks").lastElementChild;
  if(!el) return null;
  const r=el.getBoundingClientRect();
  if(!r.width) return null;
  return {r, tilt:parseFloat(el.style.getPropertyValue("--tilt"))||0};
}
/* Split the face onto a two-sided wrapper so the card can start face down. */
function flipWrap(el){
  const kind=[...el.classList].filter(c=>c==="je"||c==="sp").join(" ");
  const fl=document.createElement("div"); fl.className="fl";
  const face=document.createElement("div");
  face.className="fs f "+kind; face.innerHTML=el.innerHTML;
  face.style.color=el.style.color;
  const back=document.createElement("div"); back.className="fs b";
  fl.appendChild(face); fl.appendChild(back);
  el.innerHTML=""; el.appendChild(fl); el.classList.add("flipping");
  return fl;
}
function ringAt(el){
  const felt=$("felt"), f=felt.getBoundingClientRect(), r=el.getBoundingClientRect();
  const d=document.createElement("div"); d.className="ring";
  d.style.cssText=`left:${r.left-f.left}px; top:${r.top-f.top}px;
                   width:${r.width}px; height:${r.height}px`;
  felt.appendChild(d);
  d.animate([{transform:"scale(1)",opacity:.85},{transform:"scale(1.45)",opacity:0}],
    {duration:420, easing:"ease-out"}).onfinish=()=>d.remove();
}

function playAnim(el, card, seat){
  const src = G._from && G._from[seat];
  if(!src) return;
  const to = el.getBoundingClientRect();
  if(!to.width) return;
  // travel between centres, not corners, so the scale term does not drag the card sideways
  const dx=(src.r.left+src.r.width /2)-(to.left+to.width /2);
  const dy=(src.r.top +src.r.height/2)-(to.top +to.height/2);
  const s=src.r.width/to.width, t=src.tilt;
  // Every keyframe carries the same three functions in the same order. Mixing shapes makes
  // the browser fall back to matrix interpolation, which is where the wobble came from.
  const T=(x,y,r,sx,sy)=>`translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy??sx})`;
  const start=T(dx,dy,t,s), rest=T(0,0,0,1);

  if(isWizard(card)){                                   // SLAM
    el.animate([
      {transform:start,                              offset:0},
      {transform:T(dx*.1, dy*.1, -4, 1.22),          offset:.55},
      {transform:T(0,0,0, 1.14, .86),                offset:.72},
      {transform:rest,                               offset:1}
    ],{duration:400, easing:"cubic-bezier(.55,0,.35,1)"});
    setTimeout(()=>{
      if(!el.isConnected) return;                       // the trick moved on without us
      ringAt(el);
      $("felt").animate([{transform:"translateY(0px)"},{transform:"translateY(3px)"},
                         {transform:"translateY(0px)"}],{duration:140, easing:"ease-out"});
    },288);
  }
  else if(isJester(card)){                              // TURN OVER
    const fl=flipWrap(el);
    el.animate([
      {transform:start,                                        offset:0},
      {transform:T(dx*.5, dy*.5-24, 0, (1+s)/2*1.06),          offset:.5},
      {transform:rest,                                         offset:1}
    ],{duration:520, easing:"cubic-bezier(.3,.1,.25,1)"});
    fl.animate([{transform:"rotateY(180deg)"},{transform:"rotateY(180deg)", offset:.15},
                {transform:"rotateY(0deg)"}],
      {duration:520, easing:"cubic-bezier(.4,0,.3,1)"})
      .onfinish=()=>{
        if(!el.isConnected) return;
        el.classList.remove("flipping"); el.innerHTML=fl.firstChild.innerHTML;
      };
  }
  else{                                                 // LIFT & THROW
    el.animate([
      {transform:start,                        offset:0},
      {transform:T(dx, dy-26, 0, s*1.1),       offset:.28},
      {transform:rest,                         offset:1}
    ],{duration:460, easing:"cubic-bezier(.5,0,.2,1)"});
  }
}

/* The hand is never quite still. The bob runs on the wrapper, which owns nothing else, so the
   card inside keeps its transform free for the hover transition — that separation is what
   stops the lift snapping. A negative delay starts each card partway through its own cycle and
   the periods differ slightly, so the row never pulses in unison. */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
function startIdle(el){
  if(REDUCED.matches || el._idle) return;
  const i = +(el.dataset.idx || 0);
  el._idle = el.animate(
    [{transform:"translateY(0px)"},
     {transform:"translateY(-2.6px)"},
     {transform:"translateY(0px)"}],
    { duration: 3100 + i*230, delay: -i*370, iterations: Infinity,
      easing: "ease-in-out" });
}

/* Read every rect, then write every style. Interleaving them — measure a card, set its
   offsets, measure the next — made each measurement force a fresh synchronous layout, so a
   sixteen-card deal cost sixteen layouts inside one frame. That hitch landed exactly as the
   deal began, which is why the first moment of it always looked worse than the rest. */
function dealFrom(pile){
  const from=pile.getBoundingClientRect();
  requestAnimationFrame(()=>{
    const els=[...document.querySelectorAll(".predeal")];
    const offsets=els.map(el=>{                       // read pass: no writes in between
      const r=el.getBoundingClientRect();
      return [Math.round(from.left-r.left), Math.round(from.top-r.top)];
    });
    els.forEach((el,i)=>{                             // write pass
      el.style.setProperty("--dx", offsets[i][0]+"px");
      el.style.setProperty("--dy", offsets[i][1]+"px");
      el.classList.remove("predeal");
      el.classList.add("deal");
      // .deal owns transform while the card is in flight; drop it on landing so the idle
      // breathing can take over without the two animations fighting over the property.
      el.addEventListener("animationend", ()=>{
        el.classList.remove("deal");
        el.style.willChange="";                       // release the layer once it has landed
        const wrap=el.parentElement;
        if(wrap && wrap.classList.contains("cardwrap")) startIdle(wrap);
      }, {once:true});
    });
  });
}
function popup(text, good){
  const p=document.createElement("div");
  p.className="pop o "+(good?"good":"bad"); p.textContent=text;
  p.style.left="50%"; p.style.top="44%";
  $("felt").appendChild(p); setTimeout(()=>p.remove(),1050);
}

/* ==========================================================================
   SOLVER OVERLAY — the EV of every option, using only what you can see.

   Same determinization the bot uses to choose: sample opponent hands consistent with
   your hand, the trump card, everything played, and any suit they have shown a void in;
   solve each sample exactly; average. It deliberately does NOT peek at their real hand —
   the numbers are what a strong player could have worked out at the table, not hindsight.
   ========================================================================== */
/* On a phone the panel and the hand cannot both be on screen, so it starts closed there and
   the open button is left showing. On anything wider it is open by default. */
const NARROW = window.matchMedia("(max-width:620px)");
let solverOn = !NARROW.matches;
/* The panel must give the same answer every time you look at the same position — reopening
   it, or the round re-rendering, must not shuffle the numbers. So its determinizations are
   drawn from a generator seeded on the position itself rather than from Math.random. The
   bot keeps using real randomness; only the read-out is pinned. */
function mulberry(seed){
  let a=seed>>>0;
  return ()=>{
    a=(a+0x6D2B79F5)>>>0;
    let t=a;
    t=Math.imul(t^(t>>>15), t|1);
    t^=t+Math.imul(t^(t>>>7), t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function posSeed(){
  let h=2166136261>>>0;
  const mix=v=>{ h^=(v>>>0); h=Math.imul(h,16777619)>>>0; };
  G.hands[0].forEach(mix);
  G.played.forEach(c=>mix(c+37));
  mix(G.trumpCard+101); mix((G.trump+2)*7); mix(G.trickNo*31+G.size*131);
  mix((G.bids[0]===null?15:G.bids[0])+40);
  mix((G.bids[1]===null?15:G.bids[1])+70);
  mix(G.table[1]===null?255:G.table[1]);
  mix(G.tricks[0]*13+G.tricks[1]*17+G.leadSeat*3);
  return h>>>0;
}
/* Partial Fisher-Yates against the supplied generator. */
function sampleWith(rand, pool, k){
  const a=pool.slice();
  for(let i=0;i<k;i++){
    const j=i+((rand()*(a.length-i))|0);
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a.slice(0,k);
}
/* This used to slide down to fourteen samples on the biggest rounds, because an eight-card
   solve cost 21ms and sixty of them would have frozen the tab. After the search rewrite one
   costs 0.83ms, so the whole panel is about 50ms at any size and there is no longer a reason
   to be stingy where it hurts most — eight cards was exactly where the estimate was noisiest.
   A fixed count rather than a time budget, so the answer never depends on machine speed. */
const samplesFor = () => 80;

function unseenForMe(){
  const seen=new Set(G.hands[0]); seen.add(G.trumpCard);
  G.played.forEach(c=>seen.add(c));
  if(G.table[1]!==null) seen.add(G.table[1]);
  return DECK.filter(c=>!seen.has(c));
}
function consistentHand(rand, pool, size, voids){
  let p = (voids && voids.size) ? pool.filter(c=>!voids.has(suitOf(c))) : pool;
  if(p.length<size) p=pool;
  return sampleWith(rand, p, size);
}

/* Both readings answer the same question: what is this option worth to me, in points, on
   this round. Bid EV used to subtract the opponent's score once they had bid and not
   before, which put the two halves of the same panel on different scales and made every
   bid look bad against a strong opponent hand. That term is the same for every bid on the
   list, so it never changed which bid was best — it only moved the whole column. It now
   lives in the note instead, where it belongs. */
/* A hand does not take a fixed number of tricks — it takes however many you play for. The
   old model solved each deal once, for the most tricks you could force, and then scored every
   bid against that single number. That says "you will take T whatever you bid", so bidding
   away from T could only lose, and the column came out as a rigid ±1 ladder around T.
   Measured against 80 real rounds at size 6, that single number was the true outcome only
   44% of the time.

   What a hand really has is a BAND. Solve twice: once maximising your tricks against best
   defence, once minimising them while they push tricks at you. The first is the most you can
   guarantee, the second the fewest you can hold yourself to, and every bid between the two is
   makeable. That band contained the real outcome 84% of the time at size 6 and 80% at size 7,
   at a mean width of about one trick — so it is both far more honest and still sharp enough
   to choose with. It also explains something the old model could not: several different bids
   can all be right, and among makeable ones the highest pays best, since a made bid scores
   2 + tricks. */
/* A determinization is a few milliseconds of straight-line search, and there are up to sixty
   of them. Run back to back that is a half-second with the main thread pinned, which is what
   made the dealing and the card flights stutter — they were not slow, they were stopped.
   Handing control back between samples costs nothing in total time and lets every frame in
   between get painted. */
const yieldFrame = () => new Promise(r=>setTimeout(r,0));
/* A determinization costs 1.3ms at six cards but 21ms at eight, so a fixed "yield every other
   sample" either wastes time or blocks for two frames. Yield on elapsed instead: hand control
   back once about half a frame has been spent, whatever that turns out to be on this machine.
   Pacing only — the sample sequence and therefore the result are untouched. */
function paced(){
  let t=performance.now();
  return async () => {
    if(performance.now()-t < 8) return;
    await yieldFrame();
    t=performance.now();
  };
}

async function bidBands(){
  const unseen=unseenForMe(), size=G.size, hm=maskOf(G.hands[0]);
  const rand=mulberry(posSeed());
  const ddHi=new DoubleDummy(G.trump, tricksPayoff);
  const ddLo=new DoubleDummy(G.trump, at=>-at);
  const N=samplesFor(size), bands=[], breathe=paced();
  for(let i=0;i<N;i++){
    const om=maskOf(sampleWith(rand,unseen,size));
    const hi=ddHi.value(hm,om,G.leadSeat===0);
    const lo=-ddLo.value(hm,om,G.leadSeat===0);
    bands.push([Math.min(lo,hi), Math.max(lo,hi)]);
    await breathe();
  }
  return bands;
}
async function bidEV(legal){
  const size=G.size, bands=await bidBands(), N=bands.length;
  const rows=legal.map(b=>{
    let v=0;
    for(const [lo,hi] of bands)
      v += (b>=lo && b<=hi) ? 2+b : -Math.min(Math.abs(b-lo), Math.abs(b-hi));
    return {key:b, label:String(b), ev:v/N};
  });
  const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
  const loM=mean(bands.map(x=>x[0])), hiM=mean(bands.map(x=>x[1]));
  const makeable=new Map();
  for(const [lo,hi] of bands)
    for(let b=lo;b<=hi;b++) makeable.set(b,(makeable.get(b)||0)+1);
  const best=[...makeable.entries()].sort((a,b)=>b[1]-a[1])[0];
  return {rows, bands,
    note:`${N} deals · you can force ${loM.toFixed(1)}–${hiM.toFixed(1)} tricks`
       + ` · ${best[0]} is makeable in ${Math.round(best[1]/N*100)}% of them`};
}

/* ==========================================================================
   EXPLANATION — why the solver says what it says.

   Two ingredients. The first is exact arithmetic on what you can see: how many unseen cards
   beat a given card, and the chance the opponent is holding one of them. Their hand is a
   uniform random subset of the unseen cards, so that is a hypergeometric draw and needs no
   sampling at all.

   The second is casework measured offline over 600 rounds (see _casework.js), which answers
   the questions arithmetic cannot: how often a choice matters at all, and what the solver
   tends to do in each situation. Those constants are quoted below and are the reason the
   text can say something specific rather than restating the EV column in words.
   ========================================================================== */

/* P(at least one of `k` particular cards falls in a random `h`-subset of `u` unseen). */
function pAtLeastOne(u, h, k){
  if(k<=0 || h<=0) return 0;
  if(h>u-k) return 1;
  let p=1;                                   // P(none) = C(u-k,h)/C(u,h), built as a product
  for(let i=0;i<h;i++) p *= (u-k-i)/(u-i);
  return 1-p;
}
const pct = x => Math.round(x*100);
/* How many unseen cards would beat `card` if it were led. */
const beatsCount = (card, unseen) =>
  unseen.filter(x => trickWinner(card, x, G.trump)===1).length;

/* Measured over 600 rounds at sizes 3-8. Quoted verbatim in the text below. */
const CASE = {
  tiedShare: 79,           // % of card decisions where every legal card scored the same
  realCost: 7.5,           // mean points lost by the wrong card when the choice does matter
  hookRate: 35,            // % of rounds where the hook forbids your best bid
  hookCost: 2.9,           // points it costs when it does
  bandWidth: [35,43,17,4], // % of hands whose reachable band is 0,1,2,3 tricks wide
  duckWhenSafe: 83,        // % of the time the best card gives the trick away, once at bid
  winWhenNeeded: 80,       // % of the time it takes the trick, when you need every one
  leadJesterSafe: 47,      // % of the time leading the Jester is best, once at or over bid
};

/* One line, the single fact that decided it. These appear only in the review after a trick,
   so they have to earn their place against a player who wants to get on with the game. */
function explainBid(res){
  const size=G.size, unseen=unseenForMe(), u=unseen.length;
  const lo=res.bands.reduce((s,x)=>s+x[0],0)/res.bands.length;
  const hi=res.bands.reduce((s,x)=>s+x[1],0)/res.bands.length;
  const wiz=unseen.filter(isWizard).length;
  let t=`Playable for <b>${lo.toFixed(1)}–${hi.toFixed(1)}</b> tricks; the highest makeable bid pays most.`;
  if(G.dealer===0 && G.bids[1]!==null && !legalBids(size,true,G.bids[1]).includes(Math.round(hi)))
    t+=` The hook took it away — that happens in ${CASE.hookRate}% of rounds.`;
  else if(wiz)
    t+=` ${pct(pAtLeastOne(u,size,wiz))}% they hold a Wizard.`;
  return [t];
}

function explainCard(legal, res){
  const need=G.bids[0]-G.tricks[0], left=G.hands[0].length;
  const unseen=unseenForMe(), u=unseen.length, h=G.hands[1].length;
  const best=res.rows.slice().sort((x,y)=>y.ev-x.ev)[0];
  const head = need<=0 ? `At your bid with ${left} left`
             : need>=left ? `Need all ${left}`
             : `Need <b>${need}</b> of <b>${left}</b>`;
  if(G.table[1]===null){
    if(!best) return [head+"."];
    const m=beatsCount(best.key, unseen);
    return [`${head} · ${best.label} survives <b>${pct(1-pAtLeastOne(u,h,m))}%</b> `
      + `(${m} of ${u} unseen beat it).`];
  }
  const canWin=legal.filter(c=>trickWinner(G.table[1],c,G.trump)===1).length;
  const rule = need<=0 ? `duck ${CASE.duckWhenSafe}%`
             : need>=left ? `take it ${CASE.winWhenNeeded}%`
             : null;
  return [`${head} · ${canWin} of ${legal.length} would win`
    + (rule ? ` · best play is to ${rule} of the time` : "") + `.`];
}

async function cardEV(legal){
  const unseen=unseenForMe(), oppSize=G.hands[1].length;
  if(oppSize<1 || unseen.length<oppSize) return {rows:[], note:"nothing to sample"};
  const rand=mulberry(posSeed());
  const dd=new DoubleDummy(G.trump, scorePayoff(G.bids[0],G.bids[1])), hm=maskOf(G.hands[0]);
  const tot=new Map(legal.map(c=>[c,0]));
  const N=samplesFor(oppSize), breathe=paced();
  for(let i=0;i<N;i++){
    const vals=dd.rootValues(hm, maskOf(consistentHand(rand,unseen,oppSize,G.myVoids)),
                             G.table[1], G.tricks[0], G.tricks[1]);
    for(const c of legal) if(vals.has(c)) tot.set(c, tot.get(c)+vals.get(c));
    await breathe();
  }
  /* Chance this card takes the trick. Following, that is settled — their card is already on
     the table. Leading, it is the chance none of the cards that would beat it is in their
     hand, which is an exact hypergeometric draw over the unseen cards, not a sample. */
  const led=G.table[1];
  const winChance = c => led!==null
    ? (trickWinner(led, c, G.trump)===1 ? 1 : 0)
    : 1 - pAtLeastOne(unseen.length, oppSize, beatsCount(c, unseen));

  const rows=legal.map(c=>({key:c, label:cardName(c), ev:tot.get(c)/N, win:winChance(c)}));
  const voids=[...(G.myVoids||[])].map(s=>SUIT_WORDS[s]);
  return {rows, note:`${N} deals · ${unseen.length} unseen`
    + (voids.length?` · void in ${voids.join(", ")}`:"")};
}

/* Numbers only. The prose belongs in the review after the trick, where it is a lesson rather
   than a hint you have to read past while deciding. */
function showSolver(title, result){
  const box=$("solver");
  if(!solverOn || !result.rows.length){ box.classList.remove("on"); return; }
  box.classList.add("on");
  const best=Math.max(...result.rows.map(r=>r.ev));
  const worst=Math.min(...result.rows.map(r=>r.ev));
  const span=Math.max(best-worst, .001);
  const rows=result.rows.slice().sort((a,b)=>b.ev-a.ev).map(r=>{
    const top=r.ev>=best-1e-9;
    const w=Math.round((r.ev-worst)/span*100);
    const win = r.win===undefined ? ""
      : `<span class="sv-w">${Math.round(r.win*100)}%</span>`;
    return `<div class="sv-row${top?" best":""}">
      <span class="sv-k">${r.label}</span>
      <span class="sv-bar"><i style="width:${w}%"></i></span>${win}
      <span class="sv-v">${r.ev>=0?"+":""}${r.ev.toFixed(2)}</span></div>`;
  }).join("");
  $("svTitle").textContent=title;
  $("svBody").innerHTML=rows+`<div class="sv-note">${result.note}</div>`;
}
const hideSolver = () => { $("solver").classList.remove("on"); };

/* Solving blocks the thread for a few hundred ms on the big rounds, so say so first. */
function solving(title){
  if(!solverOn) return;
  const box=$("solver"); box.classList.add("on");
  $("svTitle").textContent=title;
  $("svBody").innerHTML=`<div class="sv-note">solving…</div>`;
}

/* ==========================================================================
   POSTMORTEM — after each trick, what the choice actually was.

   Deliberately after, not before: the point is a tight feedback loop, not a hint. Everything
   it shows was computed at the moment you decided, from the information you had then, so it
   is a fair grade rather than hindsight with the opponent's hand face up.

   Measured over 600 rounds: 79% of card decisions are ties, where every legal card scores the
   same because the contract is already safe or already dead. Saying so is most of the value —
   it stops you hunting for a lesson that is not there. The other 21% are worth 7.5 points on
   average, and those are the ones worth reading. */
let reviewOn = true;

/* The explanation text is no longer shown in the UI — it is kept only as context for the
   copy-out, where a reader who was not at the table needs it. */
const plain = arr => (arr||[]).map(t=>t.replace(/<[^>]+>/g,"")).join(" ");
function fileReview(entry){ if(G && G.review) G.review.push(entry); }

function gradeRows(rows, chosen){
  if(!rows || !rows.length) return null;
  const sorted=rows.slice().sort((a,b)=>b.ev-a.ev);
  const best=sorted[0], mine=rows.find(r=>r.key===chosen);
  if(!mine) return null;
  const spread=best.ev-sorted[sorted.length-1].ev;
  return { best, mine, cost:best.ev-mine.ev, tied:spread<1e-9, sorted };
}

function reviewLine(g, label){
  if(!g) return "";
  if(g.tied)
    return `<div class="rv-row ok"><span class="rv-k">${label}</span>
      <span class="rv-v">${g.mine.label}</span>
      <span class="rv-note">all equal</span></div>`;
  const good = g.cost < 1e-9;
  return `<div class="rv-row ${good?"ok":"bad"}"><span class="rv-k">${label}</span>
    <span class="rv-v">${g.mine.label} <i>${g.mine.ev>=0?"+":""}${g.mine.ev.toFixed(2)}</i></span>
    <span class="rv-note">${good ? "best"
      : `best <b>${g.best.label}</b> ${g.best.ev>=0?"+":""}${g.best.ev.toFixed(2)}
         · cost <b>${g.cost.toFixed(2)}</b>`}</span></div>`;
}

/* One review per round, after the score is in. Per trick it interrupted every single hand and
   most of what it had to say was "all equal" — 79% of card decisions are ties. Held to the end
   of the round it becomes a readable list of the whole hand, and the few decisions that cost
   anything sit next to each other where the pattern is visible. */
/* Everything a fresh reader needs to judge the round without having played the game: the
   rules in full, the handful of ideas that make the numbers mean something, then the round
   itself as data. Written for pasting into a chat, so it is plain text and self-contained. */
const RULES_BRIEF = `# Wizard (heads-up) — rules

Two players. 24 cards: 10 J Q K A in four suits (20), plus 2 Wizards and 2 Jesters.
Hand sizes run 1,2,...,8,8,...,2,1 — 16 rounds, 72 tricks. Each player deals each size once.
After the deal one card is turned up to set trump. A Wizard turned up means the dealer names
trump; a Jester means no trump. At the largest sizes some cards stay in the stock unseen.

Bidding: the non-dealer bids first. THE HOOK: the dealer may not choose a bid that makes the
two bids total the hand size. So the bids never sum to the tricks available, and at most one
player can be exactly right in any round.

Play: follow suit if you can. Wizards and Jesters are always legal regardless of suit.
Trick winner, in this order of precedence:
  - a Wizard LED wins outright (so with two Wizards out, the first Wizard played wins);
  - otherwise a Wizard played second wins;
  - a Jester played second always loses;
  - a Jester led loses to anything except the other Jester;
  - otherwise the highest trump, or failing that the highest card of the suit led.

Scoring, per round: hit your bid exactly = 2 + tricks taken. Miss = -(|tricks - bid|).

# Concepts that make the numbers mean something

- Duel property. Because of the hook the two bids cannot both be right, so a round is close
  to zero-sum: helping yourself and hurting them are usually the same move.
- Reachable band. A hand does not take a fixed number of tricks; it takes as many as you play
  for. Solve the deal twice — the most you can force against best defence, and the fewest you
  can hold yourself to — and every bid between the two is makeable. Measured over 600 rounds
  the band averages 0.9 tricks wide, and it contains the real outcome about 80% of the time,
  where the single "tricks you can force" number matches only about half the time.
- Among makeable bids the highest pays best, because a made bid scores 2 + tricks.
- Duplicate specials. With two Wizards, a Wizard LED always wins but a Wizard FOLLOWED loses
  to a Wizard lead. With two Jesters, a Jester FOLLOWED always loses but a Jester LED can be
  answered by the other Jester. Holding one copy guarantees nothing; holding both does.
- Most card decisions do not matter. Over 600 rounds, 79% of the points where more than one
  card was legal had every option scoring identically, because the contract was already safe
  or already dead. The other 21% were worth about 7.5 points each.

The EV figures below are in round points, from a perfect-information solver averaged over
sampled opponent hands consistent with everything visible at that moment.`;

function roundReport(items){
  const L=[], size=G.size;
  L.push(RULES_BRIEF, "", `# The round just played`, "");
  L.push(`Round ${G.idx+1} of ${G.ladder.length}, ${size} card${size>1?"s":""} each.`);
  L.push(`Trump: ${G.trump<0?"none":SUIT_WORDS[G.trump]} (${cardName(G.trumpCard)} turned up).`);
  L.push(`${G.dealer===0?"I dealt, so they bid first and the hook applied to me."
                        :"They dealt, so I bid first and the hook applied to them."}`);
  L.push(`My hand: ${(G.handDealt||[]).map(cardName).join(" ")}`);
  L.push(`Bids — me ${G.bids[0]}, them ${G.bids[1]}. Result: I took ${G.tricks[0]}, they took ${G.tricks[1]}.`);
  L.push("");
  for(const it of items){
    const g=it.grade;
    L.push(`## ${it.label}`);
    L.push(`  I chose: ${g.mine.label} (EV ${g.mine.ev>=0?"+":""}${g.mine.ev.toFixed(2)})`);
    L.push(g.tied ? `  Every legal option scored the same.`
                  : `  Best was: ${g.best.label} (EV ${g.best.ev>=0?"+":""}${g.best.ev.toFixed(2)})`);
    L.push(`  All options: ${g.sorted.map(r=>
      `${r.label} ${r.ev>=0?"+":""}${r.ev.toFixed(2)}`
      + (r.win===undefined?"":` [wins trick ${Math.round(r.win*100)}%]`)).join(" | ")}`);
    if(it.facts) L.push(`  Position: ${it.facts}`);
    L.push("");
  }
  if((G.trickLog||[]).length){
    L.push(`## How the tricks went`);
    for(const t of G.trickLog)
      L.push(`  Trick ${t.n}: ${t.iLed?"I led":"they led"} — mine ${cardName(t.mine)},`
           + ` theirs ${cardName(t.theirs)} — ${t.won?"I took it":"they took it"}`);
    L.push("");
  }
  L.push(`# What I want`, "",
    `Analyse this round. For each decision where I did not pick the best option, explain`,
    `concisely and mathematically why the best option was best: what the alternative lines`,
    `were, which cards mattered, and how the numbers work out. Keep it brief and concrete —`,
    `no restating the rules back to me. If a decision was genuinely close or a tie, say so`,
    `rather than inventing a reason.`);
  return L.join("\n");
}

/* file:// pages are not a secure context, so the async clipboard API is unavailable there.
   The textarea fallback is what actually runs when the game is opened straight off disk. */
function copyText(text, btn){
  const done=ok=>{ btn.textContent = ok ? "Copied" : "Copy failed";
                   setTimeout(()=>btn.textContent="Copy for Claude", 1600); };
  if(navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.cssText="position:fixed;top:-2000px;left:0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); done(ok);
}

async function showRoundReview(){
  // Wait for any solve still in flight before deciding the summary is empty.
  if(G && G.reviewPending.length){
    await Promise.all(G.reviewPending);
    G.reviewPending.length=0;
  }
  return new Promise(done=>{
    const items=G.review.splice(0).filter(it=>it.grade)
                        .sort((a,b)=>(a.seq||0)-(b.seq||0));
    if(!reviewOn || !items.length){ done(); return; }
    const lost=items.reduce((s,it)=>s + (it.grade.tied?0:it.grade.cost), 0);
    const ov=overlay(`<h2 class="o">Round ${G.idx+1} decisions</h2>
      <p>${lost<1e-9
        ? "You played the best option at every point that mattered."
        : `Cost of the choices you missed: <b>${lost.toFixed(2)}</b> points.`}</p>
      <div class="rv">${items.map(it=>reviewLine(it.grade, it.label)).join("")}</div>
      <div class="rv-acts">
        <button class="btn-grey o1 rv-copy">Copy for Claude</button>
        <button class="btn-gold o1 rv-go">Next round</button>
      </div>`);
    ov.classList.add("review");
    ov.querySelector(".rv-copy").onclick=e=>copyText(roundReport(items), e.currentTarget);
    ov.querySelector(".rv-go").onclick=()=>{ ov.remove(); done(); };
  });
}

/* ==========================================================================
   PROMPTS
   ========================================================================== */
function overlay(html){
  const d=document.createElement("div"); d.className="ov";
  d.innerHTML=`<div class="box">${html}</div>`;
  $("felt").appendChild(d); return d;
}
/* The solve happens whether or not the panel is showing. The panel is the spoiler; the
   review afterwards is not, and it needs the same numbers — so they are computed once, shown
   only if you asked for them, and always filed for the postmortem. */
function askCard(legal){
  return new Promise(res=>{
    pendingCard={legal,resolve:res}; render();
    if(solverOn) solving("Card EV");
    /* The solve runs to completion whether or not anyone is still looking at it. Bailing out
       once pendingCard had cleared meant that playing faster than the solver deleted that
       decision from the round review outright — which is why quick tricks, and the last one
       most of all, kept going missing from the summary. Only the panel is conditional now. */
    G._evPromise = (async ()=>{
      await new Promise(go=>setTimeout(go,0));  // let render() paint before the solve blocks
      const r = legal.length>1 ? await cardEV(legal) : {rows:[],note:"only one legal card"};
      r._why = explainCard(legal, r);
      if(pendingCard && pendingCard.legal===legal && solverOn) showSolver("Card EV", r);
      return r;
    })();
  });
}
/* The bid prompt is deliberately not a modal. It sits in the empty middle of the table so
   your hand stays on screen underneath it — you cannot choose a number without looking at
   your cards, and on a phone the old centred dialog covered them completely. When they have
   already bid, their number is the headline, because on this round it is the single most
   important fact: it fixes what you are forbidden and tells you how the hand splits. */
function askBid(legal){
  const size=G.size, theirs=G.bids[1];
  const forbidden = G.dealer===0 && theirs!==null ? size-theirs : null;
  return new Promise(res=>{
    const all=[...Array(size+1).keys()];
    const head = theirs!==null
      ? `<div class="bidhead">
           <div class="bidnum"><div class="cap o1">They bid</div>
             <div class="bignum o">${theirs}</div></div>
           <div class="bidsay">
             <div class="bidmain o">of <b>${size}</b> ${size>1?"tricks":"trick"},
               leaving <b>${size-theirs}</b> for you</div>
             <div class="bidhook o1">the hook forbids you <b>${forbidden}</b></div>
           </div>
         </div>`
      : `<div class="bidhead">
           <div class="bidnum"><div class="cap o1">They bid</div>
             <div class="bignum o dim">?</div></div>
           <div class="bidsay">
             <div class="bidmain o">You bid first on ${size} ${size>1?"tricks":"trick"}</div>
             <div class="bidhook o1">your bid forbids them <b>${size} − yours</b></div>
           </div>
         </div>`;
    const ov=overlay(`${head}
      <div class="bidrow">${all.map(b=>
        `<button class="bidbtn o ${legal.includes(b)?"btn-blue":"no"}" data-b="${b}">${b}</button>`).join("")}</div>
      <div class="bidfoot o1">Exactly right scores <b>2 + tricks</b>.
        Anything else loses the difference. Press a <b>number key</b> to bid.</div>`);
    ov.classList.add("bid");
    if(solverOn) solving("Bid EV");
    /* The bid is solved even when the panel is hidden, so the review can grade it. */
    const bidPromise = (async ()=>{
      await new Promise(go=>setTimeout(go,0));
      const r = await bidEV(legal);
      if(ov.isConnected && solverOn) showSolver("Bid EV", r);
      return r;
    })();
    ov.querySelectorAll(".bidbtn").forEach(btn=>{
      const b=+btn.dataset.b;
      if(legal.includes(b)) btn.onclick=()=>{
        const seq=G._reviewSeq++;
        G.reviewPending.push(bidPromise.then(r=>{
          if(r && r.rows && r.rows.length)
            fileReview({ seq, label:"Your bid", grade:gradeRows(r.rows,b),
                         facts:plain(explainBid(r)) });
        }).catch(()=>{}));
        ov.remove(); hideSolver(); say(`You bid ${b}`); res(b);
      };
    });
  });
}
function askTrump(){
  return new Promise(res=>{
    const ov=overlay(`<h2 class="o">A Wizard flipped</h2>
      <p>You deal, so you name trump before either bid, and they see your choice.
      Naming your real strength tells them exactly where you are strong.</p>
      <div class="suitrow">${SUITS.map((s,i)=>
        `<button class="suitbtn" style="color:${SUIT_INK[i]}" data-s="${i}">${s}
           <i class="suitkey">${i+1}</i></button>`
        ).join("")}</div>
      <div class="bidfoot o1">Press <b>1</b>–<b>4</b>.</div>`);
    ov.classList.add("trump");
    ov.querySelectorAll(".suitbtn").forEach(b=>
      b.onclick=()=>{ ov.remove(); res(+b.dataset.s); });

}
function showRoundEnd(sc){
  const made=[G.tricks[0]===G.bids[0], G.tricks[1]===G.bids[1]];
  popup((sc[0]>=0?"+":"")+sc[0], sc[0]>=0);
  return new Promise(res=>{
    const ov=overlay(`<h2 class="o">Round ${G.idx+1} over</h2>
      <table class="tbl"><tr><th></th><th>Bid</th><th>Took</th><th>Points</th><th>Total</th></tr>
      <tr><td>You</td><td>${G.bids[0]}</td><td>${G.tricks[0]}</td>
        <td class="${sc[0]>=0?"good":"bad"}">${sc[0]>=0?"+":""}${sc[0]}</td><td>${G.totals[0]}</td></tr>
      <tr><td>Them</td><td>${G.bids[1]}</td><td>${G.tricks[1]}</td>
        <td class="${sc[1]>=0?"good":"bad"}">${sc[1]>=0?"+":""}${sc[1]}</td><td>${G.totals[1]}</td></tr></table>
      <p>${made[0] ? "You made your bid; they could not."
        : made[1] ? "They made theirs. At most one of you ever can."
        : "Neither of you made it. Both bids missed the split."}</p>
      <button class="btn-gold o1" style="padding:12px 28px">Next round</button>`);
    ov.querySelector("button").onclick=()=>{ ov.remove(); res(); };
  });
}
function showGameOver(){
  const [a,b]=G.totals;
  overlay(`<h2 class="o">${a>b?"You win":a<b?"You lose":"A draw"}</h2>
    <table class="tbl"><tr><td>You</td><td style="text-align:right">${a}</td></tr>
    <tr><td>Them</td><td style="text-align:right">${b}</td></tr></table>
    <p>${G.ladder.length} rounds, ${G.ladder.reduce((x,y)=>x+y,0)} tricks. Each of you dealt
    every hand size exactly once, so the seats were even.</p>
    <button class="btn-gold o1" style="padding:12px 28px" onclick="newGame()">Play again</button>`);
}
function showRules(){
  const ov=overlay(`<h2 class="o">Wizard</h2>
    <div class="rules">
      <h3>Deck</h3>24 cards: <code>10 J Q K A</code> in four suits, plus <b>2 Wizards</b> and <b>2 Jesters</b>.
      <h3>Ladder</h3>Hand sizes 1,2,…,${PEAK},${PEAK},…,2,1. The peak is played twice so each player
      deals every size exactly once.
      <h3>Bidding</h3>Non-dealer bids first. <b>The dealer may not make the two bids total the hand
      size.</b> Tricks always sum to the hand size and bids never do, so <b>at most one player can

      <h3>Trick order</h3>1. the <b>first</b> Wizard played · 2. highest trump · 3. highest card of

      You must follow suit, but a Wizard or Jester is <b>always</b> legal.
      <h3>The specials are conditional</h3>

      ${[[1,22,"4.5%","9.1%"],[2,21,"9.5%","18.6%"],[3,20,"15%","28.4%"],[4,19,"21.1%","38.6%"],

/* ==========================================================================
   START SCREEN
   ========================================================================== */
/* The title screen is one card face down on the felt. Clicking it turns it over, and the
   Wizard it turns into is the same drawing the deck uses — the game introduces itself with
   its own art rather than with a dialog. The setup only appears once the turn has finished. */

/* The sparks behind the title card. Both translate endpoints are written here as plain
   values so the keyframe resolves no custom properties while it runs. */
function spawnEmbers(aura){
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const frag=document.createDocumentFragment();
  for(let i=0;i<14;i++){
    const s=document.createElement("span");
    const x=rnd(-75,75), dur=rnd(3.4,6);
    s.className="ember";
    s.style.setProperty("--x0", x.toFixed(0)+"px");
    s.style.setProperty("--x1", (x+rnd(-23,23)).toFixed(0)+"px");
    s.style.setProperty("--dur", dur.toFixed(2)+"s");
    s.style.animationDelay=(-rnd(0,dur)).toFixed(2)+"s";
    frag.appendChild(s);
  }
  aura.appendChild(frag);                       // one insertion, one layout
}

function startScreen(){
  const ov=document.createElement("div");
  ov.className="ov start";
  ov.innerHTML=`
    <div class="startwrap">
      <div class="startaura" id="startAura">
        <div class="startfloat" id="startFloat">
          <div class="startcard iv-sheen" id="startCard">
            <div class="fl"><div class="fs f sp">${wizardSVG()}</div><div class="fs b"></div></div>
            <div class="gloss"></div>
          </div>
        </div>
      </div>
      <div class="starthint o hn-track" id="startHint">Tap the card</div>
      <div class="startsetup" id="startSetup">
        <div class="cap o1">Opponent</div>
        <div class="bidrow" id="difRow">
          <button class="bidbtn" style="background:#2f8f5f" data-d="easy">Easy</button>
          <button class="bidbtn btn-blue" data-d="medium">Medium</button>
          <button class="bidbtn btn-red" data-d="hard">GTO</button>
        </div>
      </div>
    </div>`;
  $("felt").appendChild(ov);

  const card=$("startCard"), fl=card.querySelector(".fl");
  let turned=false;
  card.onclick=()=>{
    if(turned) return;
    turned=true;
    card.classList.add("turned");
    fl.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(180deg)"}],
      {duration:620, easing:"cubic-bezier(.34,.08,.2,1)", fill:"forwards"});
    card.animate([{transform:"translateY(0px) scale(1)"},
                  {transform:"translateY(-12px) scale(1.07)", offset:.5},
                  {transform:"translateY(0px) scale(1)"}],
      {duration:620, easing:"ease-in-out"});
    card.classList.remove("iv-sheen");
    const hint=$("startHint");
    hint.classList.remove("hn-track");
    hint.textContent="Choose your opponent";
    // The card only starts breathing and emanating once it is face up.
    setTimeout(()=>{
      $("startFloat").classList.add("id-pendulum");
      const aura=$("startAura");
      aura.classList.add("pw-embers");
      spawnEmbers(aura);
      ov.classList.add("ready");
    }, 430);
  };
  ov.querySelectorAll("#difRow button").forEach(b=>b.onclick=()=>{
    difficulty=b.dataset.d;
    ov.remove();
    document.body.classList.remove("preboot");   // the table appears only once play starts
    newGame();
  });
}
/* ==========================================================================
   KEYBOARD — the whole game is playable from the number row.

   Bidding and playing never overlap, so both can own the digits: while the bid prompt is up
   a digit is that bid, and while a card is being asked for a digit is that position in the
   fan. Both routes go through the same click handler the mouse uses, so there is one path
   into the game state rather than two that can drift apart.
   ========================================================================== */
document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

  const trumpOv=document.querySelector(".ov.trump");
  if(trumpOv){
    if(!/^[1-4]$/.test(e.key)) return;
    e.preventDefault();
    trumpOv.querySelector(`.suitbtn[data-s="${+e.key - 1}"]`).click();
    return;
  }
  const bidOv=document.querySelector(".ov.bid");
  if(bidOv){
    const key = e.key === "`" ? "0" : e.key;
    if(!/^\d$/.test(key)) return;
    const btn=bidOv.querySelector(`.bidbtn.btn-blue[data-b="${key}"]`);
    if(btn){ e.preventDefault(); btn.click(); }
    return;
  }
  if(pendingCard){
    if(!/^[1-9]$/.test(e.key)) return;
    const el=$("hand").querySelectorAll(".card")[+e.key - 1];
    if(el && el.classList.contains("playable")){ e.preventDefault(); el.click(); }
    return;
  }
  // The title card and the round summary both advance on any of the usual "go" keys.
  // Backtick joins them: it sits under the escape key, so you can keep a finger on it and
  // click through a whole round without moving your hand back to the middle of the board.
  if(e.key===" " || e.key==="Enter" || e.key==="`"){
    const go=document.querySelector(".ov .btn-gold, .startcard:not(.turned)");
    if(go){ e.preventDefault(); go.click(); }
  }
});

/* Card sizes are solved against the felt width, so a rotation or a window drag has to
   re-solve them. Debounced, because render() rebuilds the hand. */
let resizeT=null;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{ if(G && G.hands) render(); }, 120);
});

$("svClose").onclick=()=>{ solverOn=false; hideSolver(); $("svOpen").classList.add("on"); };
$("svOpen").onclick=()=>{
  solverOn=true; $("svOpen").classList.remove("on");
  if(pendingCard){
    const legal=pendingCard.legal;
    cardEV(legal).then(r=>{ if(pendingCard) showSolver("Card EV", r); });
  }else if(document.querySelector(".ov") && G && G.bids && G.bids[0]===null){
    bidEV(legalBids(G.size, G.dealer===0, G.bids[1]))
      .then(r=>{ if(document.querySelector(".ov")) showSolver("Bid EV", r); });
  }
};

if(!solverOn) $("svOpen").classList.add("on");
startScreen();
</script>
